reference_sets:
  - id: set-hydrafusion-2026
    title: "HydraFusion — fonte primária + análise crítica"
    purpose: >
      Ensinar o aluno a triangular uma alegação técnica combinando anúncio oficial e análise externa.
    reference_ids:
      - ref-github-hydrafusion-2026
      - ref-venturebeat-hydrafusion-2026
    learning_questions:
      - "Quais afirmações aparecem diretamente na fonte primária?"
      - "Quais interpretações são introduzidas pela análise secundária?"
      - "Os benchmarks sustentam a mesma conclusão para qualidade e custo?"
      - "Que informações adicionais seriam necessárias antes de adotar a arquitetura em produção?"


  - id: set-ai-banking-machine-customer-2026
    title: "AI Banking — enterprise impact + machine customers"
    purpose: >
      Conectar evidência primária de adoção empresarial em larga escala a análises prospectivas sobre customer agents
      e machine customers, distinguindo resultados observados de extrapolações arquiteturais.
    reference_ids:
      - ref-santander-ai-first-openai-2025
      - ref-santander-investor-day-2026
      - ref-gartner-machine-customers-banking-2024
      - ref-gartner-customer-ai-agents-banking-2026
    learning_questions:
      - "Quais resultados são observados e quais são metas futuras?"
      - "Que parte do valor vem do modelo e que parte vem do sistema e do operating model?"
      - "Que novos controles surgem quando um agente representa o cliente?"
      - "Como identity, delegation, authorization e auditability mudam em agent-to-agent interaction?"
      - "Que evidência seria necessária antes de permitir negociação autônoma?"


  - id: set-langgraph-orchestration-runtime-2026
    title: "LangGraph — orchestration runtime reference set"
    purpose: >
      Apoiar a Aula 22 com documentação primária sobre orchestration runtime, persistence,
      checkpointing e interrupt/resume, preservando a distinção entre conceito vendor-neutral e framework.
    reference_ids:
      - ref-langgraph-overview-2026
      - ref-langgraph-checkpoints-2026
      - ref-langgraph-interrupts-2026
    learning_questions:
      - "Quais capacidades justificam um orchestration runtime em vez de código procedural?"
      - "Qual a diferença entre checkpoint, memory e durable execution?"
      - "Como interrupt/resume implementa human-in-the-loop?"
      - "Que partes pertencem ao framework e que partes são conceitos arquiteturais gerais?"

