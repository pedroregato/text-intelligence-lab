    en:
      term: "Tool Calling"
      definition: "Mechanism by which a system requests execution of an external tool through a structured call."
      til_context: "In Lesson 17, the concept is applied to the TIL Tool Registry lab and the transition from answering to structured action."
      example: "The learner inspects the call, validates arguments, and observes the result or error before the final response."
    related: []

