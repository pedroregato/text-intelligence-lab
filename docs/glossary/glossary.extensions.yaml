version: 1
terms:
  - id: didactic-proxy
    category: core
    lesson_first_seen: "13"
    pt-BR:
      term: Proxy didático
      english_term: Didactic proxy
      definition: Representação simplificada usada para aproximar um conceito, custo, comportamento ou consequência real com finalidade de aprendizagem, sem pretender reproduzir toda a complexidade do fenômeno original.
      til_context: Na Aula 13 e no Metric Scenario Lab, valores monetários atribuídos a erros podem funcionar como proxies didáticos para tornar trade-offs visíveis e comparáveis. Eles não devem ser confundidos com uma valoração completa de consequências humanas, éticas, sociais ou regulatórias.
      example: Atribuir R$ 500 a um falso negativo em uma simulação médica pode ajudar a comparar cenários, mas esse valor não representa o valor de uma vida nem esgota o impacto de um diagnóstico perdido.
    en:
      term: Didactic proxy
      definition: A simplified representation used to approximate a real concept, cost, behavior, or consequence for learning purposes without claiming to reproduce the full complexity of the original phenomenon.
      til_context: In Lesson 13 and the Metric Scenario Lab, monetary values assigned to errors may act as didactic proxies to make trade-offs visible and comparable. They should not be confused with a complete valuation of human, ethical, social, or regulatory consequences.
      example: Assigning R$ 500 to a false negative in a medical simulation can help compare scenarios, but that amount does not represent the value of a human life or exhaust the impact of a missed diagnosis.
    related: [trade-off, false-negative, false-positive, decision-threshold]

  - id: trade-off
    category: core
    lesson_first_seen: "13"
    pt-BR:
      term: Trade-off
      english_term: Trade-off
      definition: Situação em que melhorar uma dimensão de uma decisão tende a piorar outra, exigindo equilíbrio entre objetivos que não podem ser maximizados simultaneamente.
      til_context: Na Aula 13, reduzir o threshold pode aumentar o recall e diminuir falsos negativos, mas também aumentar falsos positivos e reduzir a precisão. O melhor ponto depende do contexto, dos custos e do objetivo do sistema.
      example: Em triagem médica, aceitar mais falsos positivos pode ser um trade-off razoável se isso reduzir significativamente o risco de deixar pacientes graves sem encaminhamento.
    en:
      term: Trade-off
      definition: A situation in which improving one dimension of a decision tends to worsen another, requiring a balance between objectives that cannot all be maximized simultaneously.
      til_context: In Lesson 13, lowering a decision threshold may increase recall and reduce false negatives, but it may also increase false positives and reduce precision. The best point depends on context, costs, and system goals.
      example: In medical triage, accepting more false positives may be a reasonable trade-off if it significantly reduces the risk of missing seriously ill patients.
    related: [didactic-proxy, precision, recall, f1-score, decision-threshold]

  - id: harmonic-mean
    category: machine-learning
    lesson_first_seen: "13"
    pt-BR:
      term: Média harmônica
      english_term: Harmonic Mean
      definition: Tipo de média que dá influência relativamente maior aos valores menores e, por isso, é útil quando um resultado só deve ser considerado forte se todos os componentes combinados também forem fortes.
      til_context: >-
        No F1-score, a média harmônica combina Precisão e Recall e penaliza desequilíbrios: uma métrica muito alta não compensa facilmente a outra muito baixa.
      example: Com Precisão de 0,90 e Recall de 0,30, a média aritmética é 0,60, enquanto o F1, baseado na média harmônica, é 0,45.
    en:
      term: Harmonic Mean
      definition: A type of mean that gives relatively greater influence to smaller values and is therefore useful when a result should be considered strong only if all combined components are also strong.
      til_context: >-
        In F1-score, the harmonic mean combines Precision and Recall and penalizes imbalance: one very high metric does not easily compensate for the other being very low.
      example: With Precision 0.90 and Recall 0.30, the arithmetic mean is 0.60 while F1, based on the harmonic mean, is 0.45.
    related: [f1-score, precision, recall, trade-off]

  - id: model-routing
    category: engineering
    lesson_first_seen: "13C"
    pt-BR:
      term: Roteamento de modelos
      english_term: Model Routing
      definition: Estratégia que decide qual modelo, ferramenta ou caminho de execução deve receber cada entrada com base em critérios como dificuldade, confiança, custo, latência ou risco.
      til_context: Na Aula 13C, o roteador pode manter casos simples no modelo econômico e encaminhar casos de baixa confiança para uma camada mais forte.
      example: Uma mensagem curta e inequívoca pode ser classificada pelo baseline, enquanto um caso ambíguo é encaminhado ao Transformer.
    en:
      term: Model Routing
      definition: A strategy that decides which model, tool, or execution path should receive each input based on criteria such as difficulty, confidence, cost, latency, or risk.
      til_context: In Lesson 13C, the router can keep simple cases on the economical model and send low-confidence cases to a stronger layer.
      example: A short unambiguous message may be classified by the baseline while an ambiguous case is routed to the Transformer.
    related: [quality-gate, model-orchestration, escalation-rate, trade-off]

  - id: model-orchestration
    category: engineering
    lesson_first_seen: "13C"
    pt-BR:
      term: Orquestração de modelos
      english_term: Model Orchestration
      definition: Coordenação de múltiplos modelos e etapas de processamento em um fluxo único, incluindo regras de roteamento, avaliação, revisão, fallback e escalonamento.
      til_context: A Aula 13C compara estratégias single, cascade e critique para mostrar que o sistema pode ser mais importante do que um modelo isolado.
      example: Um modelo econômico gera a primeira resposta, um gate avalia a qualidade e um modelo premium é acionado apenas quando necessário.
    en:
      term: Model Orchestration
      definition: Coordination of multiple models and processing stages in one workflow, including routing rules, evaluation, review, fallback, and escalation.
      til_context: Lesson 13C compares single, cascade, and critique strategies to show that the system can matter more than an isolated model.
      example: An economical model produces the first answer, a gate evaluates quality, and a premium model is invoked only when needed.
    related: [model-routing, quality-gate, compound-ai-system, escalation-rate]

  - id: quality-gate
    category: evaluation
    lesson_first_seen: "13C"
    pt-BR:
      term: Quality gate
      english_term: Quality Gate
      definition: Regra ou mecanismo de avaliação que decide se uma saída possui qualidade suficiente para ser aceita ou se precisa ser rejeitada, revisada ou escalada.
      til_context: No simulador 13C, tornar o gate mais rigoroso aumenta a parcela de casos que segue para a camada premium e altera qualidade, custo e latência.
      example: Se a confiança do classificador ficar abaixo de 0,70, o caso pode ser encaminhado para um modelo mais forte ou revisão humana.
    en:
      term: Quality Gate
      definition: An evaluation rule or mechanism that decides whether an output has sufficient quality to be accepted or must be rejected, revised, or escalated.
      til_context: In the 13C simulator, making the gate stricter increases the share of cases sent to the premium layer and changes quality, cost, and latency.
      example: If classifier confidence falls below 0.70, the case may be sent to a stronger model or human review.
    related: [decision-threshold, model-routing, escalation-rate, abstention]

  - id: escalation-rate
    category: evaluation
    lesson_first_seen: "13C"
    pt-BR:
      term: Taxa de escalonamento
      english_term: Escalation Rate
      definition: Proporção de casos que deixa a camada inicial e é encaminhada para uma etapa mais cara, mais lenta, mais especializada ou humana.
      til_context: Na Aula 13C, a taxa de escalonamento é uma métrica operacional central para entender quanto o cascade realmente usa a camada premium.
      example: Uma taxa de 25% significa que um em cada quatro casos segue além do modelo inicial.
    en:
      term: Escalation Rate
      definition: The proportion of cases that leave the initial layer and are sent to a more expensive, slower, more specialized, or human stage.
      til_context: In Lesson 13C, escalation rate is a key operational metric for understanding how much the cascade actually uses the premium layer.
      example: A 25% escalation rate means one in four cases goes beyond the initial model.
    related: [quality-gate, model-routing, model-orchestration, latency]

  - id: utility-function
    category: evaluation
    lesson_first_seen: "13C"
    pt-BR:
      term: Função de utilidade
      english_term: Utility Function
      definition: Função que combina diferentes objetivos em uma pontuação comum para tornar explícitas as prioridades usadas em uma decisão.
      til_context: O simulador 13C usa uma função simples que recompensa qualidade e penaliza custo e latência, com pesos definidos pelo aluno.
      example: U = wq·Q − wc·C − wl·L permite comparar sistemas quando qualidade, custo e latência têm importâncias diferentes.
    en:
      term: Utility Function
      definition: A function that combines different objectives into a common score to make the priorities used in a decision explicit.
      til_context: The 13C simulator uses a simple function that rewards quality and penalizes cost and latency, with weights chosen by the learner.
      example: U = wq·Q − wc·C − wl·L can compare systems when quality, cost, and latency have different importance.
    related: [trade-off, model-routing, latency, cost-per-inference]

  - id: compound-ai-system
    category: engineering
    lesson_first_seen: "13C"
    pt-BR:
      term: Sistema composto de IA
      english_term: Compound AI System
      definition: Sistema de IA formado por múltiplos componentes coordenados, como modelos, ferramentas, recuperadores, regras, verificadores e etapas humanas.
      til_context: A Aula 13C amplia a avaliação do modelo isolado para a avaliação do sistema completo, incluindo roteamento, gates, custo, latência e revisão.
      example: Um baseline classifica primeiro, um Transformer trata casos difíceis e um humano revisa situações críticas.
    en:
      term: Compound AI System
      definition: An AI system composed of multiple coordinated components such as models, tools, retrievers, rules, verifiers, and human stages.
      til_context: Lesson 13C expands evaluation from an isolated model to the whole system, including routing, gates, cost, latency, and review.
      example: A baseline classifies first, a Transformer handles difficult cases, and a human reviews critical situations.
    related: [model-orchestration, model-routing, quality-gate, human-in-the-loop]

  - id: cost-per-inference
    category: production
    lesson_first_seen: "13C"
    pt-BR:
      term: Custo por inferência
      english_term: Cost per Inference
      definition: Custo associado ao processamento de uma entrada pelo sistema, podendo incluir computação, tokens, chamadas de API, infraestrutura e etapas humanas.
      til_context: No 13C, o custo pode ser informado em unidade monetária ou índice relativo, desde que a unidade seja consistente entre os sistemas comparados.
      example: Se mil classificações custam R$ 12 em recursos computacionais, o custo médio por inferência é R$ 0,012.
    en:
      term: Cost per Inference
      definition: The cost associated with processing one input through the system, potentially including compute, tokens, API calls, infrastructure, and human stages.
      til_context: In 13C, cost may be provided as currency or a relative index as long as the unit is consistent across compared systems.
      example: If one thousand classifications cost R$ 12 in compute resources, the average cost per inference is R$ 0.012.
    related: [utility-function, latency, model-routing, trade-off]

  - id: large-language-model
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Large Language Model (LLM)"
      english_term: "Large Language Model (LLM)"
      definition: "Modelo de linguagem de grande escala treinado em grandes volumes de dados para aprender padrões estatísticos de linguagem e executar tarefas como geração, transformação e análise de texto."
      til_context: "Na Aula 14, LLM é tratado como uma classe de modelo com capacidade generativa ampla, não como substituto automático de classificadores, encoders ou regras."
      example: "Um LLM pode receber uma instrução e produzir um resumo em linguagem natural."
    en:
      term: "Large Language Model (LLM)"
      definition: "A large-scale language model trained on large amounts of data to learn statistical language patterns and perform tasks such as text generation, transformation, and analysis."
      til_context: "In Lesson 14, an LLM is treated as a model class with broad generative capability, not as an automatic replacement for classifiers, encoders, or rules."
      example: "An LLM can receive an instruction and produce a natural-language summary."
    related: [autoregressive-model, generation, prompt, context-window]

  - id: autoregressive-model
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Modelo autoregressivo"
      english_term: "Autoregressive Model"
      definition: "Modelo que produz uma sequência estimando a distribuição do próximo elemento com base nos elementos anteriores já presentes no contexto."
      til_context: "Na Aula 14, a geração textual é apresentada como repetição de next-token prediction: o token escolhido passa a integrar o contexto da próxima etapa."
      example: "Após o contexto “O atendimento foi”, o modelo estima probabilidades para possíveis próximos tokens."
    en:
      term: "Autoregressive Model"
      definition: "A model that produces a sequence by estimating the distribution of the next element from the elements already present in the context."
      til_context: "In Lesson 14, text generation is introduced as repeated next-token prediction: the selected token becomes part of the context for the next step."
      example: "After the context “The service was”, the model estimates probabilities for possible next tokens."
    related: [large-language-model, generation, token, context]

  - id: prompt
    category: text-intelligence
    lesson_first_seen: "14"
    pt-BR:
      term: "Prompt"
      english_term: "Prompt"
      definition: "Texto ou conjunto de instruções e dados fornecidos ao modelo como parte do contexto para orientar uma resposta ou geração."
      til_context: "Na Aula 14, prompt é tratado como entrada contextual do modelo, não como garantia de comportamento correto."
      example: "“Resuma o atendimento em três frases” é uma instrução que pode compor um prompt."
    en:
      term: "Prompt"
      definition: "Text or a set of instructions and data provided to a model as part of the context to guide a response or generation."
      til_context: "In Lesson 14, a prompt is treated as contextual model input, not as a guarantee of correct behavior."
      example: "“Summarize the support interaction in three sentences” is an instruction that can be part of a prompt."
    related: [context, context-window, generation, large-language-model]

  - id: context
    category: text-intelligence
    lesson_first_seen: "14"
    pt-BR:
      term: "Contexto"
      english_term: "Context"
      definition: "Conjunto de tokens e informações disponíveis ao modelo no momento em que ele calcula sua próxima saída."
      til_context: "Na Aula 14, o contexto pode incluir instruções, exemplos, texto do usuário e tokens já gerados."
      example: "Uma instrução, um trecho de documento e a resposta parcial podem coexistir no contexto."
    en:
      term: "Context"
      definition: "The set of tokens and information available to the model when it computes its next output."
      til_context: "In Lesson 14, context may include instructions, examples, user text, and tokens already generated."
      example: "An instruction, a document excerpt, and a partial answer can coexist in the context."
    related: [prompt, context-window, token, autoregressive-model]

  - id: context-window
    category: production
    lesson_first_seen: "14"
    pt-BR:
      term: "Janela de contexto"
      english_term: "Context Window"
      definition: "Limite de contexto que um modelo consegue considerar em uma execução, normalmente expresso em quantidade de tokens."
      til_context: "Na Aula 14, a janela de contexto conecta capacidade do modelo a custo, latência e necessidade de selecionar informação relevante."
      example: "Um texto maior do que a janela disponível precisa ser reduzido, segmentado ou tratado por outra estratégia."
    en:
      term: "Context Window"
      definition: "The amount of context a model can consider in one execution, usually expressed as a number of tokens."
      til_context: "In Lesson 14, context window connects model capability with cost, latency, and the need to select relevant information."
      example: "A text longer than the available context window must be reduced, chunked, or handled through another strategy."
    related: [context, token, cost-per-inference, latency]

  - id: logits
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Logits"
      english_term: "Logits"
      definition: "Valores numéricos não normalizados produzidos por um modelo antes de serem convertidos em probabilidades."
      til_context: "Na Aula 14, logits didáticos são transformados por softmax para visualizar uma distribuição sobre possíveis próximos tokens."
      example: "Os valores 2.2, 1.5 e 0.7 podem ser logits associados a três tokens candidatos."
    en:
      term: "Logits"
      definition: "Unnormalized numerical scores produced by a model before being converted into probabilities."
      til_context: "In Lesson 14, didactic logits are transformed with softmax to visualize a distribution over possible next tokens."
      example: "The values 2.2, 1.5, and 0.7 can be logits associated with three candidate tokens."
    related: [generation, sampling, temperature, token]

  - id: generation
    category: text-intelligence
    lesson_first_seen: "14"
    pt-BR:
      term: "Geração"
      english_term: "Generation"
      definition: "Processo de produzir uma sequência de saída a partir de um modelo, frequentemente escolhendo tokens sucessivos condicionados ao contexto."
      til_context: "Na Aula 14, geração é contrastada com classificação para mostrar que produzir texto novo é uma capacidade diferente de escolher uma classe."
      example: "Produzir um resumo livre a partir de uma conversa é uma tarefa de geração."
    en:
      term: "Generation"
      definition: "The process of producing an output sequence from a model, often by choosing successive tokens conditioned on context."
      til_context: "In Lesson 14, generation is contrasted with classification to show that producing new text is a different capability from choosing a class."
      example: "Producing a free-form summary from a conversation is a generation task."
    related: [autoregressive-model, large-language-model, sampling, greedy-decoding]

  - id: greedy-decoding
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Greedy decoding"
      english_term: "Greedy Decoding"
      definition: "Estratégia de decodificação que escolhe, em cada etapa, o token de maior probabilidade disponível."
      til_context: "Na Aula 14, greedy decoding serve como referência determinística para comparar com estratégias de sampling."
      example: "Se “ótimo” tem a maior probabilidade, greedy decoding escolhe “ótimo” como próximo token."
    en:
      term: "Greedy Decoding"
      definition: "A decoding strategy that selects the highest-probability token at each step."
      til_context: "In Lesson 14, greedy decoding provides a deterministic reference for comparison with sampling strategies."
      example: "If “great” has the highest probability, greedy decoding selects “great” as the next token."
    related: [generation, sampling, logits, temperature]

  - id: sampling
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Sampling"
      english_term: "Sampling"
      definition: "Estratégia de seleção em que o próximo token é sorteado de acordo com uma distribuição de probabilidades, possivelmente modificada por parâmetros de decodificação."
      til_context: "Na Aula 14, sampling é usado para mostrar por que duas gerações podem divergir mesmo a partir do mesmo contexto."
      example: "Tokens com probabilidades 0,6 e 0,3 podem ambos ser escolhidos em execuções diferentes."
    en:
      term: "Sampling"
      definition: "A selection strategy in which the next token is drawn from a probability distribution, possibly modified by decoding parameters."
      til_context: "In Lesson 14, sampling is used to show why two generations can diverge even from the same context."
      example: "Tokens with probabilities 0.6 and 0.3 can both be selected in different runs."
    related: [generation, temperature, top-k, top-p]

  - id: temperature
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Temperature"
      english_term: "Temperature"
      definition: "Parâmetro de decodificação que altera a concentração da distribuição usada para selecionar tokens."
      til_context: "Na Aula 14, temperature é interpretada probabilisticamente: valores menores tendem a concentrar a distribuição e valores maiores tendem a espalhá-la."
      example: "Aplicar softmax(logits / temperature) com temperature menor pode aumentar a dominância do token mais provável."
    en:
      term: "Temperature"
      definition: "A decoding parameter that changes the concentration of the distribution used to select tokens."
      til_context: "In Lesson 14, temperature is interpreted probabilistically: lower values tend to concentrate the distribution while higher values tend to spread it."
      example: "Applying softmax(logits / temperature) with a lower temperature can increase the dominance of the most likely token."
    related: [sampling, logits, greedy-decoding, top-p]

  - id: top-k
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Top-k"
      english_term: "Top-k"
      definition: "Estratégia de decodificação que restringe a escolha aos k tokens de maior probabilidade em uma etapa de geração."
      til_context: "Na Aula 14, top-k mostra como limitar o conjunto de candidatos sem confundir restrição de amostragem com garantia de qualidade."
      example: "Com top-k = 2, apenas os dois tokens mais prováveis permanecem candidatos ao próximo passo."
    en:
      term: "Top-k"
      definition: "A decoding strategy that restricts selection to the k highest-probability tokens at a generation step."
      til_context: "In Lesson 14, top-k shows how to limit the candidate set without confusing sampling restriction with a quality guarantee."
      example: "With top-k = 2, only the two most likely tokens remain candidates for the next step."
    related: [sampling, top-p, temperature, generation]

  - id: top-p
    category: machine-learning
    lesson_first_seen: "14"
    pt-BR:
      term: "Top-p"
      english_term: "Top-p"
      definition: "Estratégia de decodificação que mantém o menor conjunto de tokens cuja probabilidade acumulada atinge um limiar p."
      til_context: "Na Aula 14, top-p é apresentado como filtro adaptativo de candidatos, também conhecido como nucleus sampling."
      example: "Com top-p = 0,80, o conjunto é ampliado até que a soma das probabilidades alcance pelo menos 80%."
    en:
      term: "Top-p"
      definition: "A decoding strategy that keeps the smallest set of tokens whose cumulative probability reaches a threshold p."
      til_context: "In Lesson 14, top-p is introduced as an adaptive candidate filter, also known as nucleus sampling."
      example: "With top-p = 0.80, the set grows until cumulative probability reaches at least 80%."
    related: [sampling, top-k, temperature, generation]

  - id: structured-output
    category: engineering
    lesson_first_seen: "14"
    pt-BR:
      term: "Saída estruturada"
      english_term: "Structured Output"
      definition: "Saída gerada segundo uma estrutura ou contrato explícito de campos, tipos ou formato que pode ser validado programaticamente."
      til_context: "Na Aula 14, structured output separa a capacidade de gerar conteúdo da necessidade de verificar se a resposta cumpre um schema esperado."
      example: "Um objeto JSON com os campos sentiment e confidence pode ser validado após a geração."
    en:
      term: "Structured Output"
      definition: "An output generated according to an explicit structure or contract of fields, types, or format that can be validated programmatically."
      til_context: "In Lesson 14, structured output separates the ability to generate content from the need to verify that a response satisfies an expected schema."
      example: "A JSON object with sentiment and confidence fields can be validated after generation."
    related: [generation, large-language-model, prompt]

  - id: hallucination
    category: evaluation
    lesson_first_seen: "14"
    pt-BR:
      term: "Alucinação"
      english_term: "Hallucination"
      definition: "Termo usado para descrever saídas geradas que apresentam conteúdo não sustentado pelo contexto, pela evidência disponível ou pelos fatos relevantes, apesar de poderem parecer plausíveis."
      til_context: "Na Aula 14, o termo é usado com cautela e não substitui a análise de tipos específicos de falha, como formato inválido, perda de restrição ou erro factual."
      example: "O modelo afirmar um dado inexistente em um documento fornecido pode ser tratado como uma forma de alucinação."
    en:
      term: "Hallucination"
      definition: "A term used for generated outputs that contain claims unsupported by the context, available evidence, or relevant facts, even when they sound plausible."
      til_context: "In Lesson 14, the term is used cautiously and does not replace analysis of specific failure types such as invalid format, constraint loss, or factual error."
      example: "A model stating a fact that is absent from a provided document can be treated as a form of hallucination."
    related: [generation, context, structured-output, evidence]

  - id: information-retrieval
    category: text-intelligence
    lesson_first_seen: "15"
    pt-BR:
      term: "Retrieval"
      english_term: "Information Retrieval"
      definition: "Processo de localizar e ordenar itens potencialmente relevantes para uma consulta dentro de uma coleção."
      til_context: "Na Aula 15, retrieval é estudado separadamente de generation para tornar observável como evidências são encontradas antes de qualquer resposta ser gerada."
      example: "Buscar os documentos mais relevantes para a consulta “como solicitar reembolso”."
    en:
      term: "Information Retrieval"
      definition: "The process of locating and ranking potentially relevant items for a query within a collection."
      til_context: "In Lesson 15, retrieval is studied separately from generation so learners can observe how evidence is found before any response is generated."
      example: "Finding the most relevant documents for the query “how to request a refund”."
    related: [query, ranking, retrieval-score, evidence]

  - id: query
    category: text-intelligence
    lesson_first_seen: "15"
    pt-BR:
      term: "Consulta"
      english_term: "Query"
      definition: "Representação da necessidade de informação usada para pesquisar uma coleção."
      til_context: "Na Aula 15, a query é comparada com documentos ou chunks para produzir scores e um ranking."
      example: "“qual é o prazo do reembolso” é uma query sobre o corpus."
    en:
      term: "Query"
      definition: "A representation of an information need used to search a collection."
      til_context: "In Lesson 15, a query is compared with documents or chunks to produce scores and a ranking."
      example: "“what is the refund deadline” is a query over the corpus."
    related: [information-retrieval, ranking, document, corpus]

  - id: lexical-search
    category: text-intelligence
    lesson_first_seen: "15"
    pt-BR:
      term: "Busca lexical"
      english_term: "Lexical Search"
      definition: "Busca baseada principalmente na correspondência e ponderação de termos presentes na consulta e nos documentos."
      til_context: "Na Aula 15, TF-IDF e cosine similarity formam a referência lexical para comparar query e documentos."
      example: "Uma consulta contendo “reembolso” tende a recuperar documentos que também contêm esse termo."
    en:
      term: "Lexical Search"
      definition: "Search based mainly on matching and weighting terms present in the query and documents."
      til_context: "In Lesson 15, TF-IDF and cosine similarity provide the lexical reference for comparing a query with documents."
      example: "A query containing “refund” tends to retrieve documents that also contain that term."
    related: [information-retrieval, semantic-search, tf-idf, cosine-similarity]

  - id: semantic-search
    category: text-intelligence
    lesson_first_seen: "15"
    pt-BR:
      term: "Busca semântica"
      english_term: "Semantic Search"
      definition: "Busca que compara representações vetoriais com o objetivo de aproximar itens por significado, não apenas por coincidência literal de termos."
      til_context: "Na Aula 15, vetores densos didáticos ilustram como expressões lexicalmente diferentes podem ficar próximas em um espaço semântico."
      example: "“recuperar senha” e “esqueci minha credencial” podem receber alta similaridade mesmo usando palavras diferentes."
    en:
      term: "Semantic Search"
      definition: "Search that compares vector representations to bring items together by meaning rather than only by literal term overlap."
      til_context: "In Lesson 15, didactic dense vectors illustrate how lexically different expressions can be close in a semantic space."
      example: "“reset password” and “forgot my credential” can have high similarity even with different wording."
    related: [information-retrieval, lexical-search, embedding, cosine-similarity]

  - id: ranking
    category: evaluation
    lesson_first_seen: "15"
    pt-BR:
      term: "Ranking"
      english_term: "Ranking"
      definition: "Ordenação de candidatos segundo um score ou critério de relevância para uma consulta."
      til_context: "Na Aula 15, o ranking torna visível quais documentos ou chunks são priorizados por um método de retrieval."
      example: "D2 pode ocupar a posição 1 porque obteve o maior score para a query de reembolso."
    en:
      term: "Ranking"
      definition: "An ordering of candidates according to a score or relevance criterion for a query."
      til_context: "In Lesson 15, ranking makes visible which documents or chunks are prioritized by a retrieval method."
      example: "D2 may rank first because it received the highest score for the refund query."
    related: [retrieval-score, top-k-retrieval, information-retrieval, query]

  - id: retrieval-score
    category: evaluation
    lesson_first_seen: "15"
    pt-BR:
      term: "Score de retrieval"
      english_term: "Retrieval Score"
      definition: "Valor produzido por um método de retrieval para representar a proximidade ou relevância relativa entre uma consulta e um item."
      til_context: "Na Aula 15, cosine similarity é usada como score em exemplos lexicais e semânticos."
      example: "Um score de 0,62 pode posicionar um documento acima de outro com 0,31 para a mesma query."
    en:
      term: "Retrieval Score"
      definition: "A value produced by a retrieval method to represent the relative proximity or relevance between a query and an item."
      til_context: "In Lesson 15, cosine similarity is used as a score in lexical and semantic examples."
      example: "A score of 0.62 may rank a document above another with 0.31 for the same query."
    related: [ranking, cosine-similarity, query, information-retrieval]

  - id: top-k-retrieval
    category: evaluation
    lesson_first_seen: "15"
    pt-BR:
      term: "Top-k de retrieval"
      english_term: "Top-k Retrieval"
      definition: "Seleção dos k itens mais bem ranqueados por um sistema de retrieval."
      til_context: "Na Aula 15, top-k de retrieval é explicitamente diferenciado do top-k usado na decodificação de geração."
      example: "Top-k = 3 devolve os três documentos com maior score para a consulta."
    en:
      term: "Top-k Retrieval"
      definition: "Selection of the k highest-ranked items returned by a retrieval system."
      til_context: "In Lesson 15, retrieval top-k is explicitly distinguished from top-k used in generation decoding."
      example: "Top-k = 3 returns the three documents with the highest scores for the query."
    related: [ranking, retrieval-score, information-retrieval]

  - id: chunk
    category: text-intelligence
    lesson_first_seen: "15"
    pt-BR:
      term: "Chunk"
      english_term: "Chunk"
      definition: "Unidade segmentada de um documento usada como item independente para processamento ou recuperação."
      til_context: "Na Aula 15, sentenças são usadas como chunks para observar como a granularidade altera o ranking."
      example: "Uma sentença sobre prazo de reembolso pode ser um chunk separado de outras informações do mesmo documento."
    en:
      term: "Chunk"
      definition: "A segmented unit of a document used as an independent item for processing or retrieval."
      til_context: "In Lesson 15, sentences are used as chunks to observe how granularity changes ranking."
      example: "A sentence about a refund deadline can be a chunk separate from other information in the same document."
    related: [chunking, overlap, document, information-retrieval]

  - id: chunking
    category: engineering
    lesson_first_seen: "15"
    pt-BR:
      term: "Chunking"
      english_term: "Chunking"
      definition: "Processo de dividir documentos em unidades menores para indexação, recuperação ou processamento."
      til_context: "Na Aula 15, chunking mostra o trade-off entre contexto amplo e precisão local na recuperação."
      example: "Dividir um documento longo em sentenças antes de calcular scores de retrieval."
    en:
      term: "Chunking"
      definition: "The process of splitting documents into smaller units for indexing, retrieval, or processing."
      til_context: "In Lesson 15, chunking shows the trade-off between broad context and local retrieval precision."
      example: "Splitting a long document into sentences before calculating retrieval scores."
    related: [chunk, overlap, information-retrieval, trade-off]

  - id: overlap
    category: engineering
    lesson_first_seen: "15"
    pt-BR:
      term: "Overlap"
      english_term: "Overlap"
      definition: "Trecho compartilhado entre chunks adjacentes para reduzir perda de contexto nas fronteiras de segmentação."
      til_context: "Na Aula 15, overlap é introduzido conceitualmente como uma decisão de chunking que aumenta redundância e custo do índice."
      example: "Dois chunks consecutivos podem compartilhar a última sentença do primeiro como primeira sentença do segundo."
    en:
      term: "Overlap"
      definition: "Content shared between adjacent chunks to reduce context loss at segmentation boundaries."
      til_context: "In Lesson 15, overlap is introduced conceptually as a chunking decision that increases redundancy and index cost."
      example: "Two consecutive chunks may share the last sentence of the first as the first sentence of the second."
    related: [chunk, chunking, cost-per-inference, trade-off]

  - id: grounding
    category: engineering
    lesson_first_seen: "15"
    pt-BR:
      term: "Grounding"
      english_term: "Grounding"
      definition: "Prática de vincular uma resposta, afirmação ou decisão a evidências explicitamente disponíveis e recuperáveis."
      til_context: "Na Aula 15, grounding é demonstrado sem LLM: a resposta determinística é construída apenas a partir do evidence pack recuperado."
      example: "Responder o prazo de reembolso citando o chunk que contém exatamente essa informação."
    en:
      term: "Grounding"
      definition: "The practice of tying a response, claim, or decision to explicitly available and retrievable evidence."
      til_context: "In Lesson 15, grounding is demonstrated without an LLM: the deterministic answer is built only from the retrieved evidence pack."
      example: "Answering the refund deadline while pointing to the chunk that explicitly contains that information."
    related: [evidence-pack, evidence, information-retrieval, chunk]

  - id: evidence-pack
    category: engineering
    lesson_first_seen: "15"
    pt-BR:
      term: "Evidence pack"
      english_term: "Evidence Pack"
      definition: "Conjunto organizado de evidências recuperadas e seus metadados preparado para sustentar uma resposta, decisão ou etapa posterior do sistema."
      til_context: "Na Aula 15, o evidence pack contém query, identificador do trecho, texto recuperado e retrieval score."
      example: "Um objeto com query, C3, o texto do chunk e seu score de similaridade."
    en:
      term: "Evidence Pack"
      definition: "An organized set of retrieved evidence and metadata prepared to support a response, decision, or later system stage."
      til_context: "In Lesson 15, the evidence pack contains the query, chunk identifier, retrieved text, and retrieval score."
      example: "An object containing the query, C3, the chunk text, and its similarity score."
    related: [grounding, evidence, retrieval-score, information-retrieval]

  - id: retrieval-augmented-generation
    category: engineering
    lesson_first_seen: "16"
    pt-BR:
      term: "Retrieval-Augmented Generation (RAG)"
      english_term: "Retrieval-Augmented Generation (RAG)"
      definition: "Arquitetura que combina recuperação de evidências com geração, inserindo informação recuperada no contexto usado para produzir a resposta."
      til_context: "Na Aula 16, RAG é decomposto em retrieval, seleção de evidência, construção de contexto, geração, grounding e avaliação."
      example: "Uma pergunta recupera dois trechos relevantes e o gerador produz a resposta usando apenas esses trechos."
    en:
      term: "Retrieval-Augmented Generation (RAG)"
      definition: "An architecture that combines evidence retrieval with generation by placing retrieved information into the context used to produce an answer."
      til_context: "In Lesson 16, RAG is decomposed into retrieval, evidence selection, context construction, generation, grounding, and evaluation."
      example: "A question retrieves two relevant passages and the generator produces an answer using only those passages."
    related: [information-retrieval, generation, grounding, evidence-pack]

  - id: generation-only
    category: engineering
    lesson_first_seen: "16"
    pt-BR:
      term: "Generation-only"
      english_term: "Generation-only"
      definition: "Configuração em que a resposta é produzida sem uma etapa explícita de retrieval de evidências externas."
      til_context: "Na Aula 16, generation-only funciona como baseline arquitetural para comparar com o fluxo RAG."
      example: "Responder uma pergunta diretamente a partir do prompt sem consultar o corpus didático."
    en:
      term: "Generation-only"
      definition: "A configuration in which an answer is produced without an explicit retrieval step over external evidence."
      til_context: "In Lesson 16, generation-only is used as an architectural baseline for comparison with the RAG flow."
      example: "Answering a question directly from the prompt without consulting the didactic corpus."
    related: [generation, retrieval-augmented-generation, grounded-answer]

  - id: context-construction
    category: engineering
    lesson_first_seen: "16"
    pt-BR:
      term: "Construção de contexto"
      english_term: "Context Construction"
      definition: "Etapa que organiza instruções, consulta e evidências recuperadas em uma entrada estruturada para o gerador."
      til_context: "Na Aula 16, o contexto é mostrado explicitamente para que o aluno veja quais trechos chegam à etapa de geração."
      example: "Combinar instrução, C1 e C2 recuperados e a pergunta em um único bloco de entrada."
    en:
      term: "Context Construction"
      definition: "The stage that organizes instructions, the query, and retrieved evidence into a structured input for the generator."
      til_context: "In Lesson 16, the context is shown explicitly so learners can see which passages reach the generation stage."
      example: "Combining an instruction, retrieved C1 and C2, and the question into one input block."
    related: [context, evidence-pack, retrieval-augmented-generation]

  - id: grounded-answer
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Resposta fundamentada"
      english_term: "Grounded Answer"
      definition: "Resposta cuja afirmação pode ser rastreada até evidências explicitamente disponíveis no contexto ou no evidence pack."
      til_context: "Na Aula 16, uma resposta só é considerada grounded quando a informação usada aparece nas evidências recuperadas."
      example: "Responder “cinco dias úteis” e indicar C3 como fonte."
    en:
      term: "Grounded Answer"
      definition: "An answer whose claim can be traced back to evidence explicitly available in the context or evidence pack."
      til_context: "In Lesson 16, an answer is considered grounded only when the information used appears in the retrieved evidence."
      example: "Answering “five business days” and identifying C3 as the source."
    related: [grounding, evidence-pack, attribution, groundedness]

  - id: groundedness
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Groundedness"
      english_term: "Groundedness"
      definition: "Grau em que as afirmações de uma resposta são sustentadas pelas evidências fornecidas ao sistema."
      til_context: "Na Aula 16, groundedness é tratada como propriedade distinta de fluência ou plausibilidade."
      example: "Uma resposta pode soar bem, mas ter groundedness baixa se incluir fatos ausentes do evidence pack."
    en:
      term: "Groundedness"
      definition: "The degree to which claims in an answer are supported by evidence provided to the system."
      til_context: "In Lesson 16, groundedness is treated as distinct from fluency or plausibility."
      example: "An answer may sound good but have low groundedness if it adds facts absent from the evidence pack."
    related: [grounded-answer, grounding, attribution]

  - id: attribution
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Atribuição de fonte"
      english_term: "Source Attribution"
      definition: "Associação explícita entre uma afirmação da resposta e a fonte ou trecho que a sustenta."
      til_context: "Na Aula 16, attribution torna a origem da resposta auditável e separa resposta correta de resposta rastreável."
      example: "A resposta indica “[C2]” ao lado da informação usada."
    en:
      term: "Source Attribution"
      definition: "An explicit association between a claim in an answer and the source or passage that supports it."
      til_context: "In Lesson 16, attribution makes answer provenance auditable and separates correctness from traceability."
      example: "The answer includes “[C2]” next to the information it uses."
    related: [grounded-answer, groundedness, evidence-pack]

  - id: retrieval-failure
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Falha de retrieval"
      english_term: "Retrieval Failure"
      definition: "Falha em que a etapa de retrieval não recupera a evidência necessária ou prioriza evidência inadequada."
      til_context: "Na Aula 16, esse tipo de falha é separado de erros posteriores de contexto ou geração."
      example: "O corpus contém a resposta, mas o trecho correto não aparece no top-k."
    en:
      term: "Retrieval Failure"
      definition: "A failure in which the retrieval stage does not retrieve the needed evidence or prioritizes unsuitable evidence."
      til_context: "In Lesson 16, this failure type is separated from later context or generation errors."
      example: "The corpus contains the answer, but the correct passage does not appear in top-k."
    related: [information-retrieval, top-k-retrieval, retrieval-score]

  - id: context-failure
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Falha de contexto"
      english_term: "Context Failure"
      definition: "Falha em que evidências adequadas foram recuperadas, mas são organizadas, truncadas ou apresentadas de forma que prejudica a etapa seguinte."
      til_context: "Na Aula 16, context failure mostra que retrieval correto não garante um contexto útil."
      example: "O trecho correto é recuperado, mas fica fora do bloco entregue ao gerador."
    en:
      term: "Context Failure"
      definition: "A failure in which suitable evidence was retrieved but is organized, truncated, or presented in a way that harms the next stage."
      til_context: "In Lesson 16, context failure shows that correct retrieval does not guarantee useful context."
      example: "The correct passage is retrieved but left out of the block given to the generator."
    related: [context-construction, retrieval-failure, generation-failure]

  - id: generation-failure
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Falha de geração"
      english_term: "Generation Failure"
      definition: "Falha em que o contexto contém evidência suficiente, mas a saída gerada ignora, distorce ou extrapola essa evidência."
      til_context: "Na Aula 16, generation failure é isolada das falhas de retrieval para facilitar diagnóstico e observabilidade."
      example: "O contexto informa cinco dias úteis, mas a resposta afirma dez dias."
    en:
      term: "Generation Failure"
      definition: "A failure in which the context contains sufficient evidence but the generated output ignores, distorts, or extrapolates beyond that evidence."
      til_context: "In Lesson 16, generation failure is isolated from retrieval failures to support diagnosis and observability."
      example: "The context states five business days, but the answer says ten days."
    related: [generation, context-failure, groundedness]

  - id: insufficient-evidence
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Evidência insuficiente"
      english_term: "Insufficient Evidence"
      definition: "Condição em que as evidências disponíveis não sustentam de forma adequada uma resposta específica."
      til_context: "Na Aula 16, o sistema deve reconhecer essa condição e preferir abstention, ampliar a busca ou escalar."
      example: "Nenhum chunk recuperado contém informação sobre o prazo solicitado."
    en:
      term: "Insufficient Evidence"
      definition: "A condition in which the available evidence does not adequately support a specific answer."
      til_context: "In Lesson 16, the system should recognize this condition and prefer abstention, broader search, or escalation."
      example: "No retrieved chunk contains information about the requested deadline."
    related: [abstention, groundedness, evidence-pack, retrieval-failure]

  - id: factuality
    category: evaluation
    lesson_first_seen: "16"
    pt-BR:
      term: "Factualidade"
      english_term: "Factuality"
      definition: "Grau em que uma afirmação ou resposta corresponde aos fatos ou à realidade relevante."
      til_context: "Na Aula 16, factualidade é diferenciada de groundedness: uma resposta pode estar apoiada em uma fonte e ainda estar errada se a fonte estiver incorreta ou desatualizada."
      example: "A resposta cita corretamente um documento antigo que afirma prazo de dez dias, embora a regra atual seja cinco."
    en:
      term: "Factuality"
      definition: "The degree to which a claim or answer corresponds to relevant facts or reality."
      til_context: "In Lesson 16, factuality is distinguished from groundedness: an answer can be supported by a source and still be wrong if that source is incorrect or outdated."
      example: "The answer correctly cites an old document stating ten days even though the current rule is five."
    related: [groundedness, attribution, provenance, freshness]

  - id: evidence-governance
    category: production
    lesson_first_seen: "16"
    pt-BR:
      term: "Governança da evidência"
      english_term: "Evidence Governance"
      definition: "Conjunto de práticas para controlar origem, autoridade, validade, atualização, versionamento e uso de evidências em um sistema."
      til_context: "Na Aula 16, governança da evidência explica por que retrieval e grounding tecnicamente corretos não garantem factualidade."
      example: "O sistema só considera documentos vigentes, aprovados e com fonte identificada."
    en:
      term: "Evidence Governance"
      definition: "A set of practices for controlling the origin, authority, validity, freshness, versioning, and use of evidence in a system."
      til_context: "In Lesson 16, evidence governance explains why technically correct retrieval and grounding do not guarantee factuality."
      example: "The system only considers current, approved documents with identified sources."
    related: [provenance, freshness, authority-level, groundedness]

  - id: freshness
    category: production
    lesson_first_seen: "16"
    pt-BR:
      term: "Atualidade da evidência"
      english_term: "Freshness"
      definition: "Propriedade que indica quão atual e ainda vigente é uma evidência para a decisão ou pergunta em análise."
      til_context: "Na Aula 16, freshness aparece como fator de governança capaz de tornar uma resposta grounded porém factualmente incorreta quando a fonte está desatualizada."
      example: "Uma política publicada em 2024 foi substituída por uma versão de 2026."
    en:
      term: "Freshness"
      definition: "A property indicating how current and still valid an item of evidence is for the question or decision being considered."
      til_context: "In Lesson 16, freshness is a governance factor that can make a grounded answer factually wrong when the source is outdated."
      example: "A policy published in 2024 was replaced by a 2026 version."
    related: [evidence-governance, provenance, authority-level]

  - id: authority-level
    category: production
    lesson_first_seen: "16"
    pt-BR:
      term: "Nível de autoridade"
      english_term: "Authority Level"
      definition: "Indicação da força ou prioridade de uma fonte para sustentar uma afirmação, decisão ou política."
      til_context: "Na Aula 16, authority level ajuda a diferenciar fontes oficiais, secundárias ou informais quando há evidências conflitantes."
      example: "Uma norma oficial vigente tem prioridade sobre uma FAQ antiga não revisada."
    en:
      term: "Authority Level"
      definition: "An indication of the strength or priority of a source for supporting a claim, decision, or policy."
      til_context: "In Lesson 16, authority level helps distinguish official, secondary, or informal sources when evidence conflicts."
      example: "A current official policy has priority over an old unreviewed FAQ."
    related: [evidence-governance, freshness, provenance]

  - id: tool-calling
    category: production
    lesson_first_seen: "17"
    pt-BR:
      term: "Chamada de ferramenta"
      english_term: "Tool Calling"
      definition: "Mecanismo pelo qual um sistema solicita a execução de uma ferramenta externa por meio de uma chamada estruturada."
      til_context: "Na Aula 17, o conceito é aplicado ao laboratório TIL Tool Registry e à transição de resposta para ação estruturada."
