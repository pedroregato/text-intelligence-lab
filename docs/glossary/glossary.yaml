version: 1
default_language: pt-BR
languages: [pt-BR, en]
terms:
  - id: data
    category: core
    lesson_first_seen: "01"
    pt-BR:
      term: Dado
      english_term: Data
      definition: Representação registrada de fatos, observações, medições, categorias, eventos ou outras informações que podem ser armazenadas, inspecionadas, processadas ou analisadas.
      til_context: No TIL, texto passa a ser tratado como dado quando pode ser organizado, observado, medido, transformado e utilizado em experimentos.
      example: Uma linha de um DataFrame contendo id, canal, rótulo e texto.
    en:
      term: Data
      definition: A recorded representation of facts, observations, measurements, categories, events, or other information that can be stored, inspected, processed, or analyzed.
      til_context: In TIL, text becomes data when it can be organized, observed, measured, transformed, and used in experiments.
      example: A DataFrame row containing an id, channel, label, and text.
    related: [observable-data, inspectable-data, dataset]
  - id: observable-data
    category: core
    lesson_first_seen: "00"
    pt-BR:
      term: Dado observável
      english_term: Observable data
      definition: Dado cujos valores, estrutura, estado ou outputs podem ser examinados diretamente.
      til_context: O aluno deve conseguir ver registros, colunas, métricas, arquivos gerados ou informações de runtime em vez de apenas assumir que algo aconteceu.
      example: Um DataFrame exibido no notebook ou um JSON de evidência baixado do Kaggle.
    en:
      term: Observable data
      definition: Data whose values, structure, state, or outputs can be directly examined.
      til_context: The learner should be able to inspect records, columns, metrics, generated files, or runtime information instead of merely assuming that something happened.
      example: A displayed DataFrame or a Kaggle evidence JSON file.
    related: [inspectable-data, evidence, reproducibility]
  - id: inspectable-data
    category: core
    lesson_first_seen: "01"
    pt-BR:
      term: Dado inspecionável
      english_term: Inspectable data
      definition: Dado que pode ser examinado sistematicamente para compreender estrutura, qualidade, consistência, anomalias, ausências e duplicações.
      til_context: Inspecionar significa perguntar quantos documentos existem, quais campos estão vazios, quais rótulos faltam e que metadados estão disponíveis.
      example: Contar textos vazios e duplicatas antes de qualquer modelagem.
    en:
      term: Inspectable data
      definition: Data that can be systematically examined to understand structure, quality, consistency, anomalies, missing values, and duplicates.
      til_context: Inspection means asking how many documents exist, which fields are empty, which labels are missing, and what metadata is available.
      example: Counting empty texts and duplicates before modeling.
    related: [observable-data, missing-value, duplicate]
  - id: reproducibility
    category: engineering
    lesson_first_seen: "00"
    pt-BR:
      term: Reprodutibilidade
      english_term: Reproducibility
      definition: Capacidade de repetir um procedimento analítico ou computacional a partir de entradas, código, condições e passos documentados e obter resultado igual ou substantivamente equivalente.
      til_context: GitHub preserva a fonte canônica; Kaggle fornece o ambiente de execução; outputs e evidências permitem verificar o resultado.
      example: Reexecutar um notebook e gerar novamente o mesmo tipo de arquivo de evidência.
    en:
      term: Reproducibility
      definition: The ability to repeat an analytical or computational procedure from documented inputs, code, conditions, and steps and obtain the same or substantively equivalent outcome.
      til_context: GitHub preserves the canonical source; Kaggle provides the execution environment; outputs and evidence make results verifiable.
      example: Re-running a notebook and generating the same type of evidence file.
    related: [evidence, runtime, source-of-truth]
  - id: evidence
    category: engineering
    lesson_first_seen: "00"
    pt-BR:
      term: Evidência
      english_term: Evidence
      definition: Artefato ou resultado observável que sustenta uma conclusão técnica.
      til_context: O curso prioriza evidência sobre suposição.
      example: Status COMPLETE do Kaggle, uma métrica, um log ou um arquivo JSON gerado.
    en:
      term: Evidence
      definition: An observable artifact or result that supports a technical conclusion.
      til_context: The course prioritizes evidence over assumption.
      example: A Kaggle COMPLETE status, a metric, a log, or a generated JSON file.
    related: [observable-data, experiment, output]
  - id: document
    category: text-intelligence
    lesson_first_seen: "01"
    pt-BR:
      term: Documento
      english_term: Document
      definition: Unidade individual de texto selecionada para análise.
      til_context: Na Aula 1, cada linha do DataFrame representa um documento.
      example: Uma mensagem, e-mail, notícia, avaliação, contrato ou chamado.
    en:
      term: Document
      definition: An individual unit of text selected for analysis.
      til_context: In Lesson 1, each DataFrame row represents one document.
      example: A message, email, news article, review, contract, or support ticket.
    related: [corpus, dataset, metadata]
  - id: corpus
    category: text-intelligence
    lesson_first_seen: "01"
    pt-BR:
      term: Corpus
      english_term: Corpus
      definition: Coleção de documentos organizada para análise linguística, estatística ou computacional.
      til_context: Um corpus pode ser pequeno e artificial para aprendizagem ou conter milhões de documentos em produção.
      example: A coleção de mensagens de atendimento usada na Aula 1.
    en:
      term: Corpus
      definition: A collection of documents organized for linguistic, statistical, or computational analysis.
      til_context: A corpus may be small and artificial for learning or contain millions of documents in production.
      example: The customer-service message collection used in Lesson 1.
    related: [document, dataset, label]
  - id: dataset
    category: core
    lesson_first_seen: "01"
    pt-BR:
      term: Dataset
      english_term: Dataset
      definition: Coleção organizada de dados utilizada para análise, experimentação ou modelagem.
      til_context: Um corpus é um dataset cujo objeto analítico central é texto, podendo também conter campos não textuais.
      example: Um DataFrame com id, canal, rótulo e texto.
    en:
      term: Dataset
      definition: An organized collection of data used for analysis, experimentation, or modeling.
      til_context: A corpus is a dataset whose central analytical object is text, while it may also contain non-text fields.
      example: A DataFrame with id, channel, label, and text.
    related: [data, corpus, metadata]
  - id: metadata
    category: core
    lesson_first_seen: "01"
    pt-BR:
      term: Metadado
      english_term: Metadata
      definition: Dado que descreve ou fornece contexto sobre outro dado.
      til_context: id, channel e label descrevem o documento; text contém o conteúdo textual.
      example: O canal de origem de uma mensagem.
    en:
      term: Metadata
      definition: Data that describes or provides context about other data.
      til_context: id, channel, and label describe the document; text contains the textual content.
      example: The source channel of a message.
    related: [document, dataset, label]
  - id: label
    category: machine-learning
    lesson_first_seen: "01"
    pt-BR:
      term: Rótulo
      english_term: Label
      definition: Categoria, classe ou valor-alvo conhecido associado a uma observação.
      til_context: Mais adiante, rótulos poderão servir como alvo em tarefas supervisionadas.
      example: duvida, reclamacao ou elogio.
    en:
      term: Label
      definition: A known category, class, or target value associated with an observation.
      til_context: Later, labels may serve as targets in supervised learning tasks.
      example: question, complaint, or praise.
    related: [class, classification, corpus]
  - id: class
    category: machine-learning
    lesson_first_seen: "01"
    pt-BR:
      term: Classe
      english_term: Class
      definition: Uma das categorias possíveis em um problema de classificação.
      til_context: Se reclamacao, elogio e duvida são rótulos possíveis, cada um representa uma classe.
      example: A classe reclamacao.
    en:
      term: Class
      definition: One of the possible categories in a classification problem.
      til_context: If complaint, praise, and question are possible labels, each represents a class.
      example: The complaint class.
    related: [label, classification]
  - id: raw-text
    category: text-intelligence
    lesson_first_seen: "01"
    pt-BR:
      term: Texto bruto
      english_term: Raw text
      definition: Texto em sua forma original ou minimamente processada antes de transformações para análise ou modelagem.
      til_context: A coluna text da Aula 1 contém texto bruto.
      example: Meu pedido ainda não chegou.
    en:
      term: Raw text
      definition: Text in its original or minimally processed form before transformations for analysis or modeling.
      til_context: The text column in Lesson 1 contains raw text.
      example: My order has not arrived yet.
    related: [document, feature]
  - id: missing-value
    category: core
    lesson_first_seen: "01"
    pt-BR:
      term: Valor ausente
      english_term: Missing value
      definition: Campo cujo valor esperado está ausente ou indefinido.
      til_context: Um label ausente é diferente de um texto vazio e pode exigir tratamento diferente.
      example: label igual a None.
    en:
      term: Missing value
      definition: A field whose expected value is absent or undefined.
      til_context: A missing label is different from an empty text and may require different treatment.
      example: A label equal to None.
    related: [inspectable-data, duplicate]
  - id: duplicate
    category: core
    lesson_first_seen: "01"
    pt-BR:
      term: Duplicata
      english_term: Duplicate
      definition: Observação ou valor repetido que aparece mais de uma vez em um dataset.
      til_context: Duplicatas devem ser investigadas antes de serem removidas automaticamente.
      example: Duas mensagens com o mesmo texto.
    en:
      term: Duplicate
      definition: A repeated observation or value appearing more than once in a dataset.
      til_context: Duplicates should be investigated before being automatically removed.
      example: Two messages with the same text.
    related: [inspectable-data, missing-value]
  - id: runtime
    category: engineering
    lesson_first_seen: "00"
    pt-BR:
      term: Runtime
      english_term: Runtime
      definition: Ambiente de software e sistema no qual o código é efetivamente executado.
      til_context: Inclui versão do Python, sistema operacional, diretório de trabalho e bibliotecas disponíveis.
      example: Kaggle executando Python em Linux.
    en:
      term: Runtime
      definition: The software and system environment in which code is actually executed.
      til_context: It includes Python version, operating system, working directory, and available libraries.
      example: Kaggle running Python on Linux.
    related: [reproducibility, output]
  - id: output
    category: engineering
    lesson_first_seen: "00"
    pt-BR:
      term: Output
      english_term: Output
      definition: Qualquer resultado produzido pela execução de código.
      til_context: Pode ser um valor exibido, tabela, arquivo, métrica, log ou gráfico.
      example: til_environment_evidence.json.
    en:
      term: Output
      definition: Any result produced by executing code.
      til_context: It may be a displayed value, table, file, metric, log, or chart.
      example: til_environment_evidence.json.
    related: [evidence, runtime]
  - id: experiment
    category: engineering
    lesson_first_seen: "00"
    pt-BR:
      term: Experimento
      english_term: Experiment
      definition: Procedimento estruturado concebido para testar uma hipótese ou validar uma suposição.
      til_context: Os experimentos do TIL registram objetivo, hipótese, ambiente, procedimento, evidência, resultado e conclusão.
      example: EDU-INFRA-001.
    en:
      term: Experiment
      definition: A structured procedure designed to test a hypothesis or validate an assumption.
      til_context: TIL experiments record objective, hypothesis, environment, procedure, evidence, result, and conclusion.
      example: EDU-INFRA-001.
    related: [evidence, reproducibility]
  - id: source-of-truth
    category: engineering
    lesson_first_seen: "00"
    pt-BR:
      term: Source of truth
      english_term: Source of truth
      definition: Local considerado a versão autoritativa e canônica de um artefato.
      til_context: GitHub é o source of truth do TIL; Kaggle é o ambiente principal de execução.
      example: O notebook canônico está no repositório GitHub.
    en:
      term: Source of truth
      definition: The location considered the authoritative and canonical version of an artifact.
      til_context: GitHub is TIL's source of truth; Kaggle is the primary execution environment.
      example: The canonical notebook lives in the GitHub repository.
    related: [reproducibility, versioning]
  - id: versioning
    category: engineering
    lesson_first_seen: "00"
    pt-BR:
      term: Versionamento
      english_term: Versioning
      definition: Rastreamento sistemático de alterações em código, documentos, dados ou outros artefatos ao longo do tempo.
      til_context: Git/GitHub mantém a história canônica; Kaggle Versions registra versões de execução.
      example: Um commit que altera uma aula.
    en:
      term: Versioning
      definition: The systematic tracking of changes to code, documents, data, or other artifacts over time.
      til_context: Git/GitHub maintains canonical history; Kaggle Versions records execution versions.
      example: A commit that changes a lesson.
    related: [source-of-truth, reproducibility]
  - id: feature
    category: machine-learning
    lesson_first_seen: "01"
    pt-BR:
      term: Feature
      english_term: Feature
      definition: Característica mensurável ou codificada utilizada como entrada de um modelo analítico ou preditivo.
      til_context: O texto bruto ainda não é uma matriz numérica de features; aulas futuras mostrarão como representá-lo.
      example: Contagens de termos ou valores TF-IDF.
    en:
      term: Feature
      definition: A measurable or encoded characteristic used as input to an analytical or predictive model.
      til_context: Raw text is not yet a numerical feature matrix; future lessons will show how to represent it.
      example: Term counts or TF-IDF values.
    related: [raw-text, model]
  - id: model
    category: machine-learning
    lesson_first_seen: "01"
    pt-BR:
      term: Modelo
      english_term: Model
      definition: Representação matemática ou computacional utilizada para descrever padrões ou produzir previsões.
      til_context: Modelos só entram depois que o curso estabelece dados, representação e avaliação.
      example: Um classificador treinado para prever categorias de documentos.
    en:
      term: Model
      definition: A mathematical or computational representation used to describe patterns or make predictions.
      til_context: Models appear only after the course establishes data, representation, and evaluation foundations.
      example: A classifier trained to predict document categories.
    related: [feature, classification]
  - id: classification
    category: machine-learning
    lesson_first_seen: "01"
    pt-BR:
      term: Classificação
      english_term: Classification
      definition: Tarefa preditiva em que uma observação é atribuída a uma entre várias classes predefinidas.
      til_context: O TIL usará classificação em problemas de documentos e mensagens.
      example: Classificar uma mensagem como reclamacao, elogio ou duvida.
    en:
      term: Classification
      definition: A predictive task in which an observation is assigned to one of several predefined classes.
      til_context: TIL will use classification for document and message problems.
      example: Classifying a message as complaint, praise, or question.
    related: [class, label, model]

  - id: bag-of-words
    category: text-intelligence
    lesson_first_seen: "03"
    pt-BR:
      term: Bag-of-Words
      english_term: Bag-of-Words
      definition: Representação textual que descreve um documento pelas ocorrências dos termos de um vocabulário, sem preservar diretamente a ordem completa das palavras.
      til_context: Na Aula 3, Bag-of-Words é a primeira ponte entre texto e uma representação numérica utilizável por modelos tradicionais.
      example: As palavras de um documento tornam-se colunas de uma matriz e seus valores representam contagens.
    en:
      term: Bag-of-Words
      definition: A text representation that describes a document through occurrences of vocabulary terms without directly preserving full word order.
      til_context: In Lesson 3, Bag-of-Words is the first bridge between text and a numerical representation usable by traditional models.
      example: Document words become matrix columns and their values represent counts.
    related: [vocabulary, document-term-matrix, feature]

  - id: vocabulary
    category: text-intelligence
    lesson_first_seen: "03"
    pt-BR:
      term: Vocabulário
      english_term: Vocabulary
      definition: Conjunto de termos distintos reconhecidos por uma representação textual em um corpus.
      til_context: Cada termo do vocabulário produzido pelo CountVectorizer pode se tornar uma feature.
      example: atendimento, excelente, gostei e não.
    en:
      term: Vocabulary
      definition: The set of distinct terms recognized by a text representation in a corpus.
      til_context: Each vocabulary term produced by CountVectorizer may become a feature.
      example: service, excellent, liked, and not.
    related: [bag-of-words, feature, corpus]

  - id: document-term-matrix
    category: text-intelligence
    lesson_first_seen: "03"
    pt-BR:
      term: Matriz documento-termo
      english_term: Document-term matrix
      definition: Matriz em que as linhas representam documentos, as colunas representam termos e os valores representam alguma medida associada à ocorrência desses termos.
      til_context: Na Aula 3, os valores são contagens produzidas pelo CountVectorizer.
      example: Uma linha por mensagem e uma coluna por palavra do vocabulário.
    en:
      term: Document-term matrix
      definition: A matrix whose rows represent documents, columns represent terms, and values represent a measure associated with term occurrence.
      til_context: In Lesson 3, values are counts produced by CountVectorizer.
      example: One row per message and one column per vocabulary word.
    related: [bag-of-words, vocabulary, sparse-matrix]

  - id: sparse-matrix
    category: machine-learning
    lesson_first_seen: "03"
    pt-BR:
      term: Matriz esparsa
      english_term: Sparse matrix
      definition: Estrutura matricial eficiente para dados em que a maioria dos valores é zero.
      til_context: Representações textuais costumam ser esparsas porque cada documento contém apenas uma pequena parte do vocabulário total.
      example: A saída padrão de CountVectorizer antes de chamar toarray().
    en:
      term: Sparse matrix
      definition: An efficient matrix structure for data in which most values are zero.
      til_context: Text representations are often sparse because each document contains only a small fraction of the full vocabulary.
      example: CountVectorizer's default output before calling toarray().
    related: [document-term-matrix, bag-of-words]

  - id: countvectorizer
    category: machine-learning
    lesson_first_seen: "03"
    pt-BR:
      term: CountVectorizer
      english_term: CountVectorizer
      definition: Classe do scikit-learn que transforma uma coleção de documentos textuais em uma matriz de contagens de tokens.
      til_context: É a ferramenta usada na Aula 3 para construir vocabulário, features e a matriz Bag-of-Words.
      example: vectorizer.fit_transform(texts).
    en:
      term: CountVectorizer
      definition: A scikit-learn class that converts a collection of text documents into a matrix of token counts.
      til_context: It is used in Lesson 3 to build the vocabulary, features, and Bag-of-Words matrix.
      example: vectorizer.fit_transform(texts).
    related: [bag-of-words, vocabulary, document-term-matrix]

  - id: tf
    category: text-intelligence
    lesson_first_seen: "04"
    pt-BR:
      term: TF
      english_term: Term Frequency
      definition: Medida da frequência de um termo dentro de um documento.
      til_context: Na Aula 4, TF compõe o primeiro fator da ponderação TF-IDF.
      example: Quantas vezes uma palavra aparece em uma mensagem.
    en:
      term: Term Frequency
      definition: A measure of how frequently a term appears within a document.
      til_context: In Lesson 4, TF is the first component of TF-IDF weighting.
      example: How many times a word appears in a message.
    related: [idf, tfidf]

  - id: idf
    category: text-intelligence
    lesson_first_seen: "04"
    pt-BR:
      term: IDF
      english_term: Inverse Document Frequency
      definition: Medida que reduz o peso de termos presentes em muitos documentos e aumenta o peso relativo de termos mais raros no corpus.
      til_context: Na Aula 4, IDF ajuda a diferenciar termos comuns de termos mais discriminantes.
      example: atendimento recebe menor IDF quando aparece em todos os documentos.
    en:
      term: Inverse Document Frequency
      definition: A measure that downweights terms appearing in many documents and relatively upweights rarer terms.
      til_context: In Lesson 4, IDF helps distinguish common terms from more discriminative ones.
      example: service receives a lower IDF when it appears in every document.
    related: [tf, tfidf, corpus]

  - id: tfidf
    category: text-intelligence
    lesson_first_seen: "04"
    pt-BR:
      term: TF-IDF
      english_term: TF-IDF
      definition: Técnica de ponderação que combina frequência de termo no documento e raridade do termo no corpus.
      til_context: Na Aula 4, TF-IDF transforma documentos em features ponderadas mais informativas do que simples contagens em muitos cenários.
      example: termos específicos recebem peso maior do que termos presentes em todos os documentos.
    en:
      term: TF-IDF
      definition: A weighting technique that combines term frequency within a document with term rarity across the corpus.
      til_context: In Lesson 4, TF-IDF transforms documents into weighted features that can be more informative than raw counts.
      example: Specific terms receive higher weight than terms occurring in every document.
    related: [tf, idf, tfidfvectorizer, feature]

  - id: tfidfvectorizer
    category: machine-learning
    lesson_first_seen: "04"
    pt-BR:
      term: TfidfVectorizer
      english_term: TfidfVectorizer
      definition: Classe do scikit-learn que converte documentos textuais em uma matriz de features ponderadas por TF-IDF.
      til_context: É a ferramenta principal utilizada na Aula 4.
      example: vectorizer.fit_transform(texts).
    en:
      term: TfidfVectorizer
      definition: A scikit-learn class that converts text documents into a TF-IDF-weighted feature matrix.
      til_context: It is the main tool used in Lesson 4.
      example: vectorizer.fit_transform(texts).
    related: [tfidf, document-term-matrix, feature]
