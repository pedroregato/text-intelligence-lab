      english_term: Precision
      definition: Proporção de previsões de uma classe que estão corretas.
      til_context: Na Aula 6, precisão é discutida quando falsos positivos têm custo relevante.
      example: Entre tudo que o modelo chamou de reclamacao, quanto realmente era reclamacao.
    en:
      term: Precision
      definition: The proportion of predictions for a class that are correct.
      til_context: In Lesson 6, precision matters when false positives are costly.
