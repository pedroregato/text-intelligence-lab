<header><div class="wrap"><h1>TIL Interactive Glossary</h1><p class="sub">Glossário vivo bilíngue do Text Intelligence Lab</p>

</div></header><main><div id="count"></div><div id="cards" class="grid"></div></main>
<script>
const terms=[{"id":"data","related":["observable-data","inspectable-data","dataset"],"pt-BR":{"term":"Dado","english_term":"Data","definition":"Representação registrada de fatos, observações, medições, categorias, eventos ou outras informações que podem ser armazenadas, inspecionadas, processadas ou analisadas.","til_context":"No TIL, texto passa a ser tratado como dado quando pode ser organizado, observado, medido, transformado e utilizado em experimentos.","example":"Uma linha de um DataFrame contendo id, canal, rótulo e texto."},"en":{"term":"Data","definition":"A recorded representation of facts, observations, measurements, categories, events, or other information that can be stored, inspected, processed, or analyzed.","til_context":"In TIL, text becomes data when it can be organized, observed, measured, transformed, and used in experiments.","example":"A DataFrame row containing an id, channel, label, and text."},"category":"core","lesson":"01"},{"id":"observable-data","related":["inspectable-data","evidence","reproducibility"],"pt-BR":{"term":"Dado observável","english_term":"Observable data","definition":"Dado cujos valores, estrutura, estado ou outputs podem ser examinados diretamente.","til_context":"O aluno deve conseguir ver registros, colunas, métricas, arquivos gerados ou informações de runtime em vez de apenas assumir que algo aconteceu.","example":"Um DataFrame exibido no notebook ou um JSON de evidência baixado do Kaggle."},"en":{"term":"Observable data","definition":"Data whose values, structure, state, or outputs can be directly examined.","til_context":"The learner should be able to inspect records, columns, metrics, generated files, or runtime information instead of merely assuming that something happened.","example":"A displayed DataFrame or a Kaggle evidence JSON file."},"category":"core","lesson":"00"},{"id":"inspectable-data","related":["observable-data","missing-value","duplicate"],"pt-BR":{"term":"Dado inspecionável","english_term":"Inspectable data","definition":"Dado que pode ser examinado sistematicamente para compreender estrutura, qualidade, consistência, anomalias, ausências e duplicações.","til_context":"Inspecionar significa perguntar quantos documentos existem, quais campos estão vazios, quais rótulos faltam e que metadados estão disponíveis.","example":"Contar textos vazios e duplicatas antes de qualquer modelagem."},"en":{"term":"Inspectable data","definition":"Data that can be systematically examined to understand structure, quality, consistency, anomalies, missing values, and duplicates.","til_context":"Inspection means asking how many documents exist, which fields are empty, which labels are missing, and what metadata is available.","example":"Counting empty texts and duplicates before modeling."},"category":"core","lesson":"01"},{"id":"reproducibility","related":["evidence","runtime","source-of-truth"],"pt-BR":{"term":"Reprodutibilidade","english_term":"Reproducibility","definition":"Capacidade de repetir um procedimento analítico ou computacional a partir de entradas, código, condições e passos documentados e obter resultado igual ou substantivamente equivalente.","til_context":"GitHub preserva a fonte canônica; Kaggle fornece o ambiente de execução; outputs e evidências permitem verificar o resultado.","example":"Reexecutar um notebook e gerar novamente o mesmo tipo de arquivo de evidência."},"en":{"term":"Reproducibility","definition":"The ability to repeat an analytical or computational procedure from documented inputs, code, conditions, and steps and obtain the same or substantively equivalent outcome.","til_context":"GitHub preserves the canonical source; Kaggle provides the execution environment; outputs and evidence make results verifiable.","example":"Re-running a notebook and generating the same type of evidence file."},"category":"engineering","lesson":"00"},{"id":"evidence","related":["observable-data","experiment","output"],"pt-BR":{"term":"Evidência","english_term":"Evidence","definition":"Artefato ou resultado observável que sustenta uma conclusão técnica.","til_context":"O curso prioriza evidência sobre suposição.","example":"Status COMPLETE do Kaggle, uma métrica, um log ou um arquivo JSON gerado."},"en":{"term":"Evidence","definition":"An observable artifact or result that supports a technical conclusion.","til_context":"The course prioritizes evidence over assumption.","example":"A Kaggle COMPLETE status, a metric, a log, or a generated JSON file."},"category":"engineering","lesson":"00"},{"id":"document","related":["corpus","dataset","metadata"],"pt-BR":{"term":"Documento","english_term":"Document","definition":"Unidade individual de texto selecionada para análise.","til_context":"Na Aula 1, cada linha do DataFrame representa um documento.","example":"Uma mensagem, e-mail, notícia, avaliação, contrato ou chamado."},"en":{"term":"Document","definition":"An individual unit of text selected for analysis.","til_context":"In Lesson 1, each DataFrame row represents one document.","example":"A message, email, news article, review, contract, or support ticket."},"category":"text-intelligence","lesson":"01"},{"id":"corpus","related":["document","dataset","label"],"pt-BR":{"term":"Corpus","english_term":"Corpus","definition":"Coleção de documentos organizada para análise linguística, estatística ou computacional.","til_context":"Um corpus pode ser pequeno e artificial para aprendizagem ou conter milhões de documentos em produção.","example":"A coleção de mensagens de atendimento usada na Aula 1."},"en":{"term":"Corpus","definition":"A collection of documents organized for linguistic, statistical, or computational analysis.","til_context":"A corpus may be small and artificial for learning or contain millions of documents in production.","example":"The customer-service message collection used in Lesson 1."},"category":"text-intelligence","lesson":"01"},{"id":"dataset","related":["data","corpus","metadata"],"pt-BR":{"term":"Dataset","english_term":"Dataset","definition":"Coleção organizada de dados utilizada para análise, experimentação ou modelagem.","til_context":"Um corpus é um dataset cujo objeto analítico central é texto, podendo também conter campos não textuais.","example":"Um DataFrame com id, canal, rótulo e texto."},"en":{"term":"Dataset","definition":"An organized collection of data used for analysis, experimentation, or modeling.","til_context":"A corpus is a dataset whose central analytical object is text, while it may also contain non-text fields.","example":"A DataFrame with id, channel, label, and text."},"category":"core","lesson":"01"},{"id":"metadata","related":["document","dataset","label"],"pt-BR":{"term":"Metadado","english_term":"Metadata","definition":"Dado que descreve ou fornece contexto sobre outro dado.","til_context":"id, channel e label descrevem o documento; text contém o conteúdo textual.","example":"O canal de origem de uma mensagem."},"en":{"term":"Metadata","definition":"Data that describes or provides context about other data.","til_context":"id, channel, and label describe the document; text contains the textual content.","example":"The source channel of a message."},"category":"core","lesson":"01"},{"id":"label","related":["class","classification","corpus"],"pt-BR":{"term":"Rótulo","english_term":"Label","definition":"Categoria, classe ou valor-alvo conhecido associado a uma observação.","til_context":"Mais adiante, rótulos poderão servir como alvo em tarefas supervisionadas.","example":"duvida, reclamacao ou elogio."},"en":{"term":"Label","definition":"A known category, class, or target value associated with an observation.","til_context":"Later, labels may serve as targets in supervised learning tasks.","example":"question, complaint, or praise."},"category":"machine-learning","lesson":"01"},{"id":"class","related":["label","classification"],"pt-BR":{"term":"Classe","english_term":"Class","definition":"Uma das categorias possíveis em um problema de classificação.","til_context":"Se reclamacao, elogio e duvida são rótulos possíveis, cada um representa uma classe.","example":"A classe reclamacao."},"en":{"term":"Class","definition":"One of the possible categories in a classification problem.","til_context":"If complaint, praise, and question are possible labels, each represents a class.","example":"The complaint class."},"category":"machine-learning","lesson":"01"},{"id":"raw-text","related":["document","feature"],"pt-BR":{"term":"Texto bruto","english_term":"Raw text","definition":"Texto em sua forma original ou minimamente processada antes de transformações para análise ou modelagem.","til_context":"A coluna text da Aula 1 contém texto bruto.","example":"Meu pedido ainda não chegou."},"en":{"term":"Raw text","definition":"Text in its original or minimally processed form before transformations for analysis or modeling.","til_context":"The text column in Lesson 1 contains raw text.","example":"My order has not arrived yet."},"category":"text-intelligence","lesson":"01"},{"id":"missing-value","related":["inspectable-data","duplicate"],"pt-BR":{"term":"Valor ausente","english_term":"Missing value","definition":"Campo cujo valor esperado está ausente ou indefinido.","til_context":"Um label ausente é diferente de um texto vazio e pode exigir tratamento diferente.","example":"label igual a None."},"en":{"term":"Missing value","definition":"A field whose expected value is absent or undefined.","til_context":"A missing label is different from an empty text and may require different treatment.","example":"A label equal to None."},"category":"core","lesson":"01"},{"id":"duplicate","related":["inspectable-data","missing-value"],"pt-BR":{"term":"Duplicata","english_term":"Duplicate","definition":"Observação ou valor repetido que aparece mais de uma vez em um dataset.","til_context":"Duplicatas devem ser investigadas antes de serem removidas automaticamente.","example":"Duas mensagens com o mesmo texto."},"en":{"term":"Duplicate","definition":"A repeated observation or value appearing more than once in a dataset.","til_context":"Duplicates should be investigated before being automatically removed.","example":"Two messages with the same text."},"category":"core","lesson":"01"},{"id":"runtime","related":["reproducibility","output"],"pt-BR":{"term":"Runtime","english_term":"Runtime","definition":"Ambiente de software e sistema no qual o código é efetivamente executado.","til_context":"Inclui versão do Python, sistema operacional, diretório de trabalho e bibliotecas disponíveis.","example":"Kaggle executando Python em Linux."},"en":{"term":"Runtime","definition":"The software and system environment in which code is actually executed.","til_context":"It includes Python version, operating system, working directory, and available libraries.","example":"Kaggle running Python on Linux."},"category":"engineering","lesson":"00"},{"id":"output","related":["evidence","runtime"],"pt-BR":{"term":"Output","english_term":"Output","definition":"Qualquer resultado produzido pela execução de código.","til_context":"Pode ser um valor exibido, tabela, arquivo, métrica, log ou gráfico.","example":"til_environment_evidence.json."},"en":{"term":"Output","definition":"Any result produced by executing code.","til_context":"It may be a displayed value, table, file, metric, log, or chart.","example":"til_environment_evidence.json."},"category":"engineering","lesson":"00"},{"id":"experiment","related":["evidence","reproducibility"],"pt-BR":{"term":"Experimento","english_term":"Experiment","definition":"Procedimento estruturado concebido para testar uma hipótese ou validar uma suposição.","til_context":"Os experimentos do TIL registram objetivo, hipótese, ambiente, procedimento, evidência, resultado e conclusão.","example":"EDU-INFRA-001."},"en":{"term":"Experiment","definition":"A structured procedure designed to test a hypothesis or validate an assumption.","til_context":"TIL experiments record objective, hypothesis, environment, procedure, evidence, result, and conclusion.","example":"EDU-INFRA-001."},"category":"engineering","lesson":"00"},{"id":"source-of-truth","related":["reproducibility","versioning"],"pt-BR":{"term":"Source of truth","english_term":"Source of truth","definition":"Local considerado a versão autoritativa e canônica de um artefato.","til_context":"GitHub é o source of truth do TIL; Kaggle é o ambiente principal de execução.","example":"O notebook canônico está no repositório GitHub."},"en":{"term":"Source of truth","definition":"The location considered the authoritative and canonical version of an artifact.","til_context":"GitHub is TIL's source of truth; Kaggle is the primary execution environment.","example":"The canonical notebook lives in the GitHub repository."},"category":"engineering","lesson":"00"},{"id":"versioning","related":["source-of-truth","reproducibility"],"pt-BR":{"term":"Versionamento","english_term":"Versioning","definition":"Rastreamento sistemático de alterações em código, documentos, dados ou outros artefatos ao longo do tempo.","til_context":"Git/GitHub mantém a história canônica; Kaggle Versions registra versões de execução.","example":"Um commit que altera uma aula."},"en":{"term":"Versioning","definition":"The systematic tracking of changes to code, documents, data, or other artifacts over time.","til_context":"Git/GitHub maintains canonical history; Kaggle Versions records execution versions.","example":"A commit that changes a lesson."},"category":"engineering","lesson":"00"},{"id":"feature","related":["raw-text","model"],"pt-BR":{"term":"Feature","english_term":"Feature","definition":"Característica mensurável ou codificada utilizada como entrada de um modelo analítico ou preditivo.","til_context":"O texto bruto ainda não é uma matriz numérica de features; aulas futuras mostrarão como representá-lo.","example":"Contagens de termos ou valores TF-IDF."},"en":{"term":"Feature","definition":"A measurable or encoded characteristic used as input to an analytical or predictive model.","til_context":"Raw text is not yet a numerical feature matrix; future lessons will show how to represent it.","example":"Term counts or TF-IDF values."},"category":"machine-learning","lesson":"01"},{"id":"model","related":["feature","classification"],"pt-BR":{"term":"Modelo","english_term":"Model","definition":"Representação matemática ou computacional utilizada para descrever padrões ou produzir previsões.","til_context":"Modelos só entram depois que o curso estabelece dados, representação e avaliação.","example":"Um classificador treinado para prever categorias de documentos."},"en":{"term":"Model","definition":"A mathematical or computational representation used to describe patterns or make predictions.","til_context":"Models appear only after the course establishes data, representation, and evaluation foundations.","example":"A classifier trained to predict document categories."},"category":"machine-learning","lesson":"01"},{"id":"classification","related":["class","label","model"],"pt-BR":{"term":"Classificação","english_term":"Classification","definition":"Tarefa preditiva em que uma observação é atribuída a uma entre várias classes predefinidas.","til_context":"O TIL usará classificação em problemas de documentos e mensagens.","example":"Classificar uma mensagem como reclamacao, elogio ou duvida."},"en":{"term":"Classification","definition":"A predictive task in which an observation is assigned to one of several predefined classes.","til_context":"TIL will use classification for document and message problems.","example":"Classifying a message as complaint, praise, or question."},"category":"machine-learning","lesson":"01"},{"id":"bag-of-words","related":["vocabulary","document-term-matrix","feature"],"pt-BR":{"term":"Bag-of-Words","english_term":"Bag-of-Words","definition":"Representação textual que descreve um documento pelas ocorrências dos termos de um vocabulário, sem preservar diretamente a ordem completa das palavras.","til_context":"Na Aula 3, Bag-of-Words é a primeira ponte entre texto e uma representação numérica utilizável por modelos tradicionais.","example":"As palavras de um documento tornam-se colunas de uma matriz e seus valores representam contagens."},"en":{"term":"Bag-of-Words","definition":"A text representation that describes a document through occurrences of vocabulary terms without directly preserving full word order.","til_context":"In Lesson 3, Bag-of-Words is the first bridge between text and a numerical representation usable by traditional models.","example":"Document words become matrix columns and their values represent counts."},"category":"text-intelligence","lesson":"03"},{"id":"vocabulary","related":["bag-of-words","feature","corpus"],"pt-BR":{"term":"Vocabulário","english_term":"Vocabulary","definition":"Conjunto de termos distintos reconhecidos por uma representação textual em um corpus.","til_context":"Cada termo do vocabulário produzido pelo CountVectorizer pode se tornar uma feature.","example":"atendimento, excelente, gostei e não."},"en":{"term":"Vocabulary","definition":"The set of distinct terms recognized by a text representation in a corpus.","til_context":"Each vocabulary term produced by CountVectorizer may become a feature.","example":"service, excellent, liked, and not."},"category":"text-intelligence","lesson":"03"},{"id":"document-term-matrix","related":["bag-of-words","vocabulary","sparse-matrix"],"pt-BR":{"term":"Matriz documento-termo","english_term":"Document-term matrix","definition":"Matriz em que as linhas representam documentos, as colunas representam termos e os valores representam alguma medida associada à ocorrência desses termos.","til_context":"Na Aula 3, os valores são contagens produzidas pelo CountVectorizer.","example":"Uma linha por mensagem e uma coluna por palavra do vocabulário."},"en":{"term":"Document-term matrix","definition":"A matrix whose rows represent documents, columns represent terms, and values represent a measure associated with term occurrence.","til_context":"In Lesson 3, values are counts produced by CountVectorizer.","example":"One row per message and one column per vocabulary word."},"category":"text-intelligence","lesson":"03"},{"id":"sparse-matrix","related":["document-term-matrix","bag-of-words"],"pt-BR":{"term":"Matriz esparsa","english_term":"Sparse matrix","definition":"Estrutura matricial eficiente para dados em que a maioria dos valores é zero.","til_context":"Representações textuais costumam ser esparsas porque cada documento contém apenas uma pequena parte do vocabulário total.","example":"A saída padrão de CountVectorizer antes de chamar toarray()."},"en":{"term":"Sparse matrix","definition":"An efficient matrix structure for data in which most values are zero.","til_context":"Text representations are often sparse because each document contains only a small fraction of the full vocabulary.","example":"CountVectorizer's default output before calling toarray()."},"category":"machine-learning","lesson":"03"},{"id":"countvectorizer","related":["bag-of-words","vocabulary","document-term-matrix"],"pt-BR":{"term":"CountVectorizer","english_term":"CountVectorizer","definition":"Classe do scikit-learn que transforma uma coleção de documentos textuais em uma matriz de contagens de tokens.","til_context":"É a ferramenta usada na Aula 3 para construir vocabulário, features e a matriz Bag-of-Words.","example":"vectorizer.fit_transform(texts)."},"en":{"term":"CountVectorizer","definition":"A scikit-learn class that converts a collection of text documents into a matrix of token counts.","til_context":"It is used in Lesson 3 to build the vocabulary, features, and Bag-of-Words matrix.","example":"vectorizer.fit_transform(texts)."},"category":"machine-learning","lesson":"03"},{"id":"tf","related":["idf","tfidf"],"pt-BR":{"term":"TF","english_term":"Term Frequency","definition":"Medida da frequência de um termo dentro de um documento.","til_context":"Na Aula 4, TF compõe o primeiro fator da ponderação TF-IDF.","example":"Quantas vezes uma palavra aparece em uma mensagem."},"en":{"term":"Term Frequency","definition":"A measure of how frequently a term appears within a document.","til_context":"In Lesson 4, TF is the first component of TF-IDF weighting.","example":"How many times a word appears in a message."},"category":"text-intelligence","lesson":"04"},{"id":"idf","related":["tf","tfidf","corpus"],"pt-BR":{"term":"IDF","english_term":"Inverse Document Frequency","definition":"Medida que reduz o peso de termos presentes em muitos documentos e aumenta o peso relativo de termos mais raros no corpus.","til_context":"Na Aula 4, IDF ajuda a diferenciar termos comuns de termos mais discriminantes.","example":"atendimento recebe menor IDF quando aparece em todos os documentos."},"en":{"term":"Inverse Document Frequency","definition":"A measure that downweights terms appearing in many documents and relatively upweights rarer terms.","til_context":"In Lesson 4, IDF helps distinguish common terms from more discriminative ones.","example":"service receives a lower IDF when it appears in every document."},"category":"text-intelligence","lesson":"04"},{"id":"tfidf","related":["tf","idf","tfidfvectorizer","feature"],"pt-BR":{"term":"TF-IDF","english_term":"TF-IDF","definition":"Técnica de ponderação que combina frequência de termo no documento e raridade do termo no corpus.","til_context":"Na Aula 4, TF-IDF transforma documentos em features ponderadas mais informativas do que simples contagens em muitos cenários.","example":"termos específicos recebem peso maior do que termos presentes em todos os documentos."},"en":{"term":"TF-IDF","definition":"A weighting technique that combines term frequency within a document with term rarity across the corpus.","til_context":"In Lesson 4, TF-IDF transforms documents into weighted features that can be more informative than raw counts.","example":"Specific terms receive higher weight than terms occurring in every document."},"category":"text-intelligence","lesson":"04"},{"id":"tfidfvectorizer","related":["tfidf","document-term-matrix","feature"],"pt-BR":{"term":"TfidfVectorizer","english_term":"TfidfVectorizer","definition":"Classe do scikit-learn que converte documentos textuais em uma matriz de features ponderadas por TF-IDF.","til_context":"É a ferramenta principal utilizada na Aula 4.","example":"vectorizer.fit_transform(texts)."},"en":{"term":"TfidfVectorizer","definition":"A scikit-learn class that converts text documents into a TF-IDF-weighted feature matrix.","til_context":"It is the main tool used in Lesson 4.","example":"vectorizer.fit_transform(texts)."},"category":"machine-learning","lesson":"04"},{"id":"supervised-learning","related":["label","classification","training"],"pt-BR":{"term":"Aprendizagem supervisionada","english_term":"Supervised learning","definition":"Abordagem de Machine Learning em que o modelo aprende a partir de exemplos associados a respostas conhecidas.","til_context":"Na Aula 5, cada texto possui um rótulo conhecido usado durante o treinamento.","example":"Mensagens rotuladas como duvida, reclamacao ou elogio."},"en":{"term":"Supervised learning","definition":"A Machine Learning approach in which a model learns from examples associated with known target answers.","til_context":"In Lesson 5, each text has a known label used during training.","example":"Messages labeled as question, complaint, or praise."},"category":"machine-learning","lesson":"05"},{"id":"train-test-split","related":["training","accuracy","supervised-learning"],"pt-BR":{"term":"Divisão treino/teste","english_term":"Train/test split","definition":"Separação de um dataset em uma parte usada para treinamento e outra reservada para avaliação.","til_context":"Na Aula 5, train_test_split evita avaliar o modelo apenas nos exemplos usados para aprender.","example":"67% dos exemplos para treino e 33% para teste."},"en":{"term":"Train/test split","definition":"Splitting a dataset into one portion used for training and another reserved for evaluation.","til_context":"In Lesson 5, train_test_split prevents evaluating the model only on examples used for learning.","example":"67% of examples for training and 33% for testing."},"category":"machine-learning","lesson":"05"},{"id":"multinomial-naive-bayes","related":["classification","tfidf","baseline"],"pt-BR":{"term":"Multinomial Naive Bayes","english_term":"Multinomial Naive Bayes","definition":"Algoritmo probabilístico frequentemente usado como baseline em classificação de texto com features de contagem ou ponderadas.","til_context":"Na Aula 5, MultinomialNB recebe features TF-IDF e aprende a prever classes.","example":"MultinomialNB() dentro de um Pipeline."},"en":{"term":"Multinomial Naive Bayes","definition":"A probabilistic algorithm often used as a baseline for text classification with count-based or weighted features.","til_context":"In Lesson 5, MultinomialNB receives TF-IDF features and learns to predict classes.","example":"MultinomialNB() inside a Pipeline."},"category":"machine-learning","lesson":"05"},{"id":"accuracy","related":["metric","classification","train-test-split"],"pt-BR":{"term":"Acurácia","english_term":"Accuracy","definition":"Proporção de previsões corretas entre todas as previsões realizadas.","til_context":"Na Aula 5, a acurácia é apresentada como uma primeira métrica, com a ressalva de que não deve ser interpretada isoladamente.","example":"3 acertos em 4 previsões correspondem a acurácia 0,75."},"en":{"term":"Accuracy","definition":"The proportion of correct predictions among all predictions made.","til_context":"In Lesson 5, accuracy is introduced as a first metric with the caveat that it should not be interpreted alone.","example":"3 correct predictions out of 4 correspond to accuracy 0.75."},"category":"machine-learning","lesson":"05"},{"id":"confusion-matrix","related":["precision","recall","f1-score","accuracy"],"pt-BR":{"term":"Matriz de confusão","english_term":"Confusion matrix","definition":"Tabela que cruza classes reais e previstas para mostrar acertos e tipos de erro de um classificador.","til_context":"Na Aula 6, a matriz de confusão permite observar quais classes estão sendo confundidas.","example":"Linhas representam classes reais e colunas classes previstas."},"en":{"term":"Confusion matrix","definition":"A table crossing true and predicted classes to show correct predictions and error types.","til_context":"In Lesson 6, the confusion matrix shows which classes are being confused.","example":"Rows represent true classes and columns predicted classes."},"category":"machine-learning","lesson":"06"},{"id":"precision","related":["recall","f1-score","confusion-matrix"],"pt-BR":{"term":"Precisão","english_term":"Precision","definition":"Proporção de previsões de uma classe que estão corretas.","til_context":"Na Aula 6, precisão é discutida quando falsos positivos têm custo relevante.","example":"Entre tudo que o modelo chamou de reclamacao, quanto realmente era reclamacao."},"en":{"term":"Precision","definition":"The proportion of predictions for a class that are correct.","til_context":"In Lesson 6, precision matters when false positives are costly.","example":"Of everything predicted as complaint, how much was actually complaint."},"category":"machine-learning","lesson":"06"},{"id":"recall","related":["precision","f1-score","confusion-matrix"],"pt-BR":{"term":"Recall","english_term":"Recall","definition":"Proporção de exemplos reais de uma classe que o modelo conseguiu identificar.","til_context":"Na Aula 6, recall é discutido quando perder exemplos positivos é especialmente custoso.","example":"Entre todas as reclamações reais, quantas foram detectadas."},"en":{"term":"Recall","definition":"The proportion of actual examples of a class that the model successfully identifies.","til_context":"In Lesson 6, recall matters when missing positive examples is especially costly.","example":"Of all real complaints, how many were detected."},"category":"machine-learning","lesson":"06"},{"id":"f1-score","related":["precision","recall","confusion-matrix"],"pt-BR":{"term":"F1-score","english_term":"F1-score","definition":"Média harmônica entre precisão e recall.","til_context":"Na Aula 6, F1-score é apresentado como uma forma de equilibrar as duas métricas.","example":"Útil quando precisão e recall precisam ser considerados em conjunto."},"en":{"term":"F1-score","definition":"The harmonic mean of precision and recall.","til_context":"In Lesson 6, F1-score is introduced as a way to balance both metrics.","example":"Useful when precision and recall must be considered together."},"category":"machine-learning","lesson":"06"},{"id":"macro-average","related":["weighted-average","f1-score"],"pt-BR":{"term":"Macro average","english_term":"Macro average","definition":"Média simples de uma métrica calculada separadamente para cada classe.","til_context":"Na Aula 6, macro average ajuda a dar o mesmo peso a todas as classes.","example":"Média dos F1-scores das classes sem ponderação por tamanho."},"en":{"term":"Macro average","definition":"The unweighted mean of a metric computed separately for each class.","til_context":"In Lesson 6, macro average gives equal weight to each class.","example":"Mean of class F1-scores without weighting by class size."},"category":"machine-learning","lesson":"06"},{"id":"weighted-average","related":["macro-average","f1-score"],"pt-BR":{"term":"Weighted average","english_term":"Weighted average","definition":"Média de uma métrica ponderada pelo número de exemplos de cada classe.","til_context":"Na Aula 6, weighted average é comparada à macro average em cenários com classes de tamanhos diferentes.","example":"Classes maiores contribuem mais para a média."},"en":{"term":"Weighted average","definition":"A metric average weighted by the number of examples in each class.","til_context":"In Lesson 6, weighted average is compared with macro average for differently sized classes.","example":"Larger classes contribute more to the average."},"category":"machine-learning","lesson":"06"},{"id":"cross-validation","related":["grid-search","hyperparameter","train-test-split"],"pt-BR":{"term":"Validação cruzada","english_term":"Cross-validation","definition":"Estratégia de avaliação que divide os dados de treinamento em múltiplas partes e alterna quais partes são usadas para treino e validação.","til_context":"Na Aula 7, validação cruzada permite comparar configurações sem usar o conjunto de teste final.","example":"Validação cruzada com 3 folds."},"en":{"term":"Cross-validation","definition":"An evaluation strategy that splits training data into multiple parts and rotates which parts are used for training and validation.","til_context":"In Lesson 7, cross-validation allows configuration comparison without using the final test set.","example":"3-fold cross-validation."},"category":"machine-learning","lesson":"07"},{"id":"hyperparameter","related":["grid-search","cross-validation"],"pt-BR":{"term":"Hiperparâmetro","english_term":"Hyperparameter","definition":"Configuração definida antes do treinamento que controla o comportamento de um algoritmo ou pipeline.","til_context":"Na Aula 7, ngram_range, min_df e alpha são hiperparâmetros ajustados.","example":"classifier__alpha igual a 0.5 ou 1.0."},"en":{"term":"Hyperparameter","definition":"A configuration set before training that controls the behavior of an algorithm or pipeline.","til_context":"In Lesson 7, ngram_range, min_df, and alpha are tuned hyperparameters.","example":"classifier__alpha equal to 0.5 or 1.0."},"category":"machine-learning","lesson":"07"},{"id":"grid-search","related":["cross-validation","hyperparameter"],"pt-BR":{"term":"Grid Search","english_term":"Grid Search","definition":"Estratégia de busca que avalia sistematicamente combinações predefinidas de hiperparâmetros.","til_context":"Na Aula 7, GridSearchCV combina Grid Search e validação cruzada para selecionar configurações.","example":"Testar diferentes valores de ngram_range, min_df e alpha."},"en":{"term":"Grid Search","definition":"A search strategy that systematically evaluates predefined combinations of hyperparameters.","til_context":"In Lesson 7, GridSearchCV combines Grid Search and cross-validation to select configurations.","example":"Testing different ngram_range, min_df, and alpha values."},"category":"machine-learning","lesson":"07"},{"id":"overfitting","related":["cross-validation","train-test-split"],"pt-BR":{"term":"Overfitting","english_term":"Overfitting","definition":"Situação em que um modelo ou processo de seleção se ajusta excessivamente aos dados observados e perde capacidade de generalização.","til_context":"Na Aula 7, olhar repetidamente o conjunto de teste durante o tuning é apresentado como risco de overfitting ao teste.","example":"Escolher repetidamente configurações pela melhor nota no teste final."},"en":{"term":"Overfitting","definition":"A situation in which a model or selection process fits observed data too closely and loses generalization ability.","til_context":"In Lesson 7, repeatedly consulting the test set during tuning is presented as a risk of test-set overfitting.","example":"Repeatedly choosing configurations based on the final test score."},"category":"machine-learning","lesson":"07"},{"id":"token","related":["tokenization","raw-text"],"pt-BR":{"term":"Token","english_term":"Token","definition":"Unidade resultante da segmentação de um texto para processamento computacional.","til_context":"Na Aula 2, começamos tratando palavras como tokens, embora outras técnicas possam usar subpalavras ou caracteres.","example":"Na frase \"atendimento excelente\", atendimento e excelente podem ser tokens."},"en":{"term":"Token","definition":"A unit produced by segmenting text for computational processing.","til_context":"In Lesson 2, we begin by treating words as tokens, although other techniques may use subwords or characters.","example":"In \"excellent service\", excellent and service may be tokens."},"category":"text-intelligence","lesson":"02"},{"id":"tokenization","related":["token","normalization","raw-text"],"pt-BR":{"term":"Tokenização","english_term":"Tokenization","definition":"Processo de dividir texto em unidades menores chamadas tokens.","til_context":"Na Aula 2, comparamos uma estratégia simples com split e uma tokenização baseada em expressão regular.","example":"\"atendimento excelente\" se torna [\"atendimento\", \"excelente\"]."},"en":{"term":"Tokenization","definition":"The process of splitting text into smaller units called tokens.","til_context":"In Lesson 2, we compare a simple split strategy with regular-expression tokenization.","example":"\"excellent service\" becomes [\"excellent\", \"service\"]."},"category":"text-intelligence","lesson":"02"},{"id":"normalization","related":["tokenization","raw-text"],"pt-BR":{"term":"Normalização textual","english_term":"Text normalization","definition":"Conjunto de transformações aplicadas para reduzir variações superficiais do texto preservando a informação relevante ao problema.","til_context":"Na Aula 2, usamos minúsculas e remoção de espaços nas extremidades como exemplos simples.","example":"\" ATENDIMENTO \" se torna \"atendimento\"."},"en":{"term":"Text normalization","definition":"A set of transformations used to reduce superficial text variation while preserving information relevant to the problem.","til_context":"In Lesson 2, lowercasing and trimming whitespace are used as simple examples.","example":"\" SERVICE \" becomes \"service\"."},"category":"text-intelligence","lesson":"02"},{"id":"regular-expression","related":["tokenization"],"pt-BR":{"term":"Expressão regular","english_term":"Regular expression","definition":"Linguagem compacta de padrões usada para localizar, validar ou extrair sequências de caracteres.","til_context":"Na Aula 2, a biblioteca padrão re é usada para extrair tokens com um padrão simples.","example":"re.findall(r\"\\\\b\\\\w+\\\\b\", text)."},"en":{"term":"Regular expression","definition":"A compact pattern language used to locate, validate, or extract character sequences.","til_context":"In Lesson 2, Python's standard re library is used to extract tokens with a simple pattern.","example":"re.findall(r\"\\\\b\\\\w+\\\\b\", text)."},"category":"engineering","lesson":"02"}]; const categories={"core":{"pt-BR":"Conceitos fundamentais","en":"Core concepts"},"text-intelligence":{"pt-BR":"Text Intelligence","en":"Text Intelligence"},"engineering":{"pt-BR":"Experimentação e engenharia","en":"Experimentation and engineering"},"machine-learning":{"pt-BR":"Machine Learning e estatística","en":"Machine Learning and statistics"}}; let lang="pt-BR";
