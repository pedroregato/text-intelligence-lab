s different from an empty text and may require different treatment.", "example": "A label equal to None."}, "related": ["inspectable-data", "duplicate"]}, {"id": "duplicate", "category": "core", "lesson_first_seen": "01", "pt-BR": {"term": "Duplicata", "english_term": "Duplicate", "definition": "Observação ou valor repetido que aparece mais de uma vez em um dataset.", "til_context": "Duplicatas devem ser investigadas antes de serem removidas automaticamente.", "example": "Duas mensagens com o mesmo texto."}, "en": {"term": "Duplicate", "definition": "A repeated observation or value appearing more than once in a dataset.", "til_context": "Duplicates should be investigated before being automatically removed.", "example": "Two messages with the same text."}, "related": ["inspectable-data", "missing-value"]}, {"id": "runtime", "category": "engineering", "lesson_first_seen": "00", "pt-BR": {"term": "Runtime", "english_term": "Runtime", "definition": "Ambiente de software e sistema no qual o código é efetivamente executado.", "til_context": "Inclui versão do Python, sistema operacional, diretório de trabalho e bibliotecas disponíveis.", "example": "Kaggle executando Python em Linux."}, "en": {"term": "Runtime", "definition": "The software and system environment in which code is actually executed.", "til_context": "It includes Python version, operating system, working directory, and available libraries.", "example": "Kaggle running Python on Linux."}, "related": ["reproducibility", "output"]}, {"id": "output", "category": "engineering", "lesson_first_seen": "00", "pt-BR": {"term": "Output", "english_term": "Output", "definition": "Qualquer resultado produzido pela execução de código.", "til_context": "Pode ser um valor exibido, tabela, arquivo, métrica, log ou gráfico.", "example": "til_environment_evidence.json."}, "en": {"term": "Output", "definition": "Any result produced by executing code.", "til_context": "It may be a displayed value, table, file, metric, log, or char ion": "The systematic tracking of changes to code, documents, data, or other artifacts over time.", "til_context": "Git/GitHub maintains canonical history; Kaggle Versions records execution versions.", "example": "A commit that changes a lesson."}, "related": ["source-of-truth", "reproducibility"]}, {"id": "feature", "category": "machine-learning", "lesson_first_seen": "01", "pt-BR": {"term": "Feature", "english_term": "Feature", "definition": "Característica mensurável ou codificada utilizada como entrada de um modelo analítico ou preditivo.", "til_context": "O texto bruto ainda não é uma matriz numérica de features; aulas futuras mostrarão como representá-lo.", "example": "Contagens de termos ou valores TF-IDF."}, "en": {"term": "Feature", "definition": "A measurable or encoded characteristic used as input to an analytical or predictive model.", "til_context": "Raw text is not yet a numerical feature matrix; future lessons will show how to represent it.", "example": "Term counts or TF-IDF values."}, "related": ["raw-text", "model"]}, {"id": "model", "category": "machine-learning", "lesson_first_seen": "01", "pt-BR": {"term": "Modelo", "english_term": "Model", "definition": "Representação matemática ou computacional utilizada para descrever padrões ou produzir previsões.", "til_context": "Modelos só entram depois que o curso estabelece dados, representação e avaliação.", "example": "Um classificador treinado para prever categorias de documentos."}, "en": {"term": "Model", "definition": "A mathematical or computational representation used to describe patterns or make predictions.", "til_context": "Models appear only after the course establishes data, representation, and evaluation foundations.", "example": "A classifier trained to predict document categories."}, "related": ["feature", "classification"]}, {"id": "classification", "category": "machine-learning", "lesson_first_seen": "01", "pt-BR": {"term": "Classificação", "english_term": "Classification", "definition": "Tarefa preditiva em que uma observação é atribuída a uma entre várias classes predefinidas.", "til_context": "O TIL usará classificação em problemas de documentos e mensagens.", "example": "Classificar uma mensagem como reclamacao, elogio ou duvida."}, "en": {"term": "Classification", "definition": "A predictive task in which an observation is assigned to one of several predefined classes.", "til_context": "TIL will use classification for document and message problems.", "example": "Classifying a message as complaint, praise, or question."}, "related": ["class", "label", "model"]}, {"id": "bag-of-words", "category": "text-intelligence", "lesson_first_seen": "03", "pt-BR": {"term": "Bag-of-Words", "english_term": "Bag-of-Words", "definition": "Representação textual que descreve um documento pelas ocorrências dos termos de um vocabulário, sem preservar diretamente a ordem completa das palavras.", "til_context": "Na Aula 3, Bag-of-Words é a primeira ponte entre texto e uma representação numérica utilizável por modelos tradicionais.", "example": "As palavras de um documento tornam-se colunas de uma matriz e seus valores representam contagens."}, "en": {"term": "Bag-of-Words", "definition": "A text representation that describes a document through occurrences of vocabulary terms without directly preserving full word order.", "til_context": "In Lesson 3, Bag-of-Words is the first bridge between text and a numerical representation usable by traditional models.", "example": "Document words become matrix columns and their values represent counts."}, "related": ["vocabulary", "document-term-matrix", "feature"]}, {"id": "vocabulary", "category": "text-intelligence", "lesson_first_seen": "03", "pt-BR": {"term": "Vocabulário", "english_term": "Vocabulary", "definition": "Conjunto de termos distintos reconhecidos por uma representação textual em um corpus.", "til_context": "Cada termo do vocabulário produzido pelo CountVectorizer pode se tornar uma feature.", "example": "atendimento, excelente, gostei e não."}, "en": {"term": "Vocabulary", "definition": "The set of distinct terms recognized by a text representation in a corpus.", "til_context": "Each vocabulary term produced by CountVectorizer may become a feature.", "example": "service, excellent, liked, and not."}, "related": ["bag-of-words", "feature", "corpus"]}, {"id": "document-term-matrix", "category": "text-intelligence", "lesson_first_seen": "03", "pt-BR": {"term": "Matriz documento-termo", "english_term": "Document-term matrix", "definition": "Matriz em que as linhas representam documentos, as colunas representam termos e os valores representam alguma medida associada à ocorrência desses termos.", "til_context": "Na Aula 3, os valores são contagens produzidas pelo CountVectorizer.", "example": "Uma linha por mensagem e uma coluna por palavra do vocabulário."}, "en": {"term": "Document-term matrix", "definition": "A matrix whose rows represent documents, columns represent terms, and values represent a measure associated with term occurrence.", "til_context": "In Lesson 3, values are counts produced by CountVectorizer.", "example": "One row per message and one column per vocabulary word."}, "related": ["bag-of-words", "vocabulary", "sparse-matrix"]}, {"id": "sparse-matrix", "category": "machine-learning", "lesson_first_seen": "03", "pt-BR": {"term": "Matriz esparsa", "english_term": "Sparse matrix", "definition": "Estrutura matricial eficiente para dados em que a maioria dos valores é zero.", "til_context": "Representações textuais costumam ser esparsas porque cada documento contém apenas uma pequena parte do vocabulário total.", "example": "A saída padrão de CountVectorizer antes de chamar toarray()."}, "en": {"term": "Sparse matrix", "definition": "An efficient matrix structure for data in which most values are zero.", "til_context": "Text representations are often sparse because each document contains only a small fraction of the full vocabulary.", "example": "CountVectorizer's default output before calling toarray()."}, "related": ["document-term-matrix", "bag-of-words"]}, {"id": "countvectorizer", "category": "machine-learning", "lesson_first_seen": "03", "pt-BR": {"term": "CountVectorizer", "english_term": "CountVectorizer", "definition": "Classe do scikit-learn que transforma uma coleção de documentos textuais em uma matriz de contagens de tokens.", "til_context": "É a ferramenta usada na Aula 3 para construir vocabulário, features e a matriz Bag-of-Words.", "example": "vectorizer.fit_transform(texts)."}, "en": {"term": "CountVectorizer", "definition": "A scikit-learn class that converts a collection of text documents into a matrix of token counts.", "til_context": "It is used in Lesson 3 to build the vocabulary, features, and Bag-of-Words matrix.", "example": "vectorizer.fit_transform(texts)."}, "related": ["bag-of-words", "vocabulary", "document-term-matrix"]}, {"id": "tf", "category": "text-intelligence", "lesson_first_seen": "04", "pt-BR": {"term": "TF", "english_term": "Term Frequency", "definition": "Medida da frequência de um termo dentro de um documento.", "til_context": "Na Aula 4, TF compõe o primeiro fator da ponderação TF-IDF.", "example": "Quantas vezes uma palavra aparece em uma mensagem."}, "en": {"term": "Term Frequency", "definition": "A measure of how frequently a term appears within a document.", "til_context": "In Lesson 4, TF is the first component of TF-IDF weighting.", "example": "How many times a word appears in a message."}, "related": ["idf", "tfidf"]}, {"id": "idf", "category": "text-intelligence", "lesson_first_seen": "04", "pt-BR": {"term": "IDF", "english_term": "Inverse Document Frequency", "definition": "Medida que reduz o peso de termos presentes em muitos documentos e aumenta o peso relativo de termos mais raros no corpus.", "til_context": "Na Aula 4, IDF ajuda a diferenciar termos comuns de termos mais discriminantes.", "example": "atendimento recebe menor IDF quando aparece em todos os documentos."}, "en": {"term": "Inverse Document Frequency", "definition": "A measure that downweights terms appearing in many documents and relatively upweights rarer terms.", "til_context": "In Lesson 4, IDF helps distinguish common terms from more discriminative ones.", "example": "service receives a lower IDF when it appears in every document."}, "related": ["tf", "tfidf", "corpus"]}, {"id": "tfidf", "category": "text-intelligence", "lesson_first_seen": "04", "pt-BR": {"term": "TF-IDF", "english_term": "TF-IDF", "definition": "Técnica de ponderação que combina frequência de termo no documento e raridade do termo no corpus.", "til_context": "Na Aula 4, TF-IDF transforma documentos em features ponderadas mais informativas do que simples contagens em muitos cenários.", "example": "termos específicos recebem peso maior do que termos presentes em todos os documentos."}, "en": {"term": "TF-IDF", "definition": "A weighting technique that combines term frequency within a document with term rarity across the corpus.", "til_context": "In Lesson 4, TF-IDF transforms documents into weighted features that can be more informative than raw counts.", "example": "Specific terms receive higher weight than terms occurring in every document."}, "related": ["tf", "idf", "tfidfvectorizer", "feature"]}, {"id": "tfidfvectorizer", "category": "machine-learning", "lesson_first_seen": "04", "pt-BR": {"term": "TfidfVectorizer", "english_term": "TfidfVectorizer", "definition": "Classe do scikit-learn que converte documentos textuais em uma matriz de features ponderadas por TF-IDF.", "til_context": "É a ferramenta principal utilizada na Aula 4.", "example": "vectorizer.fit_transform(texts)."}, "en": {"term": "TfidfVectorizer", "definition": "A scikit-learn class that converts text documents into a TF-IDF-weighted feature matrix.", "til_context": "It is the main tool used in Lesson 4.", "example": "vectorizer.fit_transform(texts)."}, "related": ["tfidf", "document-term-matrix", "feature"]}, {"id": "supervised-learning", "category": "machine-learning", "lesson_first_seen": "05", "pt-BR": {"term": "Aprendizagem supervisionada", "english_term": "Supervised learning", "definition": "Abordagem de Machine Learning em que o modelo aprende a partir de exemplos associados a respostas conhecidas.", "til_context": "Na Aula 5, cada texto possui um rótulo conhecido usado durante o treinamento.", "example": "Mensagens rotuladas como duvida, reclamacao ou elogio."}, "en": {"term": "Supervised learning", "definition": "A Machine Learning approach in which a model learns from examples associated with known target answers.", "til_context": "In Lesson 5, each text has a known label used during training.", "example": "Messages labeled as question, complaint, or praise."}, "related": ["label", "classification", "training"]}, {"id": "train-test-split", "category": "machine-learning", "lesson_first_seen": "05", "pt-BR": {"term": "Divisão treino/teste", "english_term": "Train/test split", "definition": "Separação de um dataset em uma parte usada para treinamento e outra reservada para avaliação.", "til_context": "Na Aula 5, train_test_split evita avaliar o modelo apenas nos exemplos usados para aprender.", "example": "67% dos exemplos para treino e 33% para teste."}, "en": {"term": "Train/test split", "definition": "Splitting a dataset into one portion used for training and another reserved for evaluation.", "til_context": "In Lesson 5, train_test_split prevents evaluating the model only on examples used for learning.", "example": "67% of examples for training and 33% for testing."}, "related": ["training", "accuracy", "supervised-learning"]}, {"id": "multinomial-naive-bayes", "category": "machine-learning", "lesson_first_seen": "05", "pt-BR": {"term": "Multinomial Naive Bayes", "english_term": "Multinomial Naive Bayes", "definition": "Algoritmo probabilístico frequentemente usado como baseline em classificação de texto com features de contagem ou ponderadas.", "til_context": "Na Aula 5, MultinomialNB recebe features TF-IDF e aprende a prever classes.", "example": "MultinomialNB() dentro de um Pipeline."}, "en": {"term": "Multinomial Naive Bayes", "definition": "A probabilistic algorithm often used as a baseline for text classification with count-based or weighted features.", "til_context": "In Lesson 5, MultinomialNB receives TF-IDF features and learns to predict classes.", "example": "MultinomialNB() inside a Pipeline."}, "related": ["classification", "tfidf", "baseline"]}, {"id": "accuracy", "category": "machine-learning", "lesson_first_seen": "05", "pt-BR": {"term": "Acurácia", "english_term": "Accuracy", "definition": "Proporção de previsões corretas entre todas as previsões realizadas.", "til_context": "Na Aula 5, a acurácia é apresentada como uma primeira métrica, com a ressalva de que não deve ser interpretada isoladamente.", "example": "3 acertos em 4 previsões correspondem a acurácia 0,75."}, "en": {"term": "Accuracy", "definition": "The proportion of correct predictions among all predictions made.", "til_context": "In Lesson 5, accuracy is introduced as a first metric with the caveat that it should not be interpreted alone.", "example": "3 correct predictions out of 4 correspond to accuracy 0.75."}, "related": ["metric", "classification", "train-test-split"]}, {"id": "confusion-matrix", "category": "machine-learning", "lesson_first_seen": "06", "pt-BR": {"term": "Matriz de confusão", "english_term": "Confusion matrix", "definition": "Tabela que cruza classes reais e previstas para mostrar acertos e tipos de erro de um classificador.", "til_context": "Na Aula 6, a matriz de confusão permite observar quais classes estão sendo confundidas.", "example": "Linhas representam classes reais e colunas classes previstas."}, "en": {"term": "Confusion matrix", "definition": "A table crossing true and predicted classes to show correct predictions and error types.", "til_context": "In Lesson 6, the confusion matrix shows which classes are being confused.", "example": "Rows represent true classes and columns predicted classes."}, "related": ["precision", "recall", "f1-score", "accuracy"]}, {"id": "precision", "category": "machine-learning", "lesson_first_seen": "06", "pt-BR": {"term": "Precisão", "english_term": "Precision", "definition": "Proporção de previsões de uma classe que estão corretas.", "til_context": "Na Aula 6, precisão é discutida quando falsos positivos têm custo relevante.", "example": "Entre tudo que o modelo chamou de reclamacao, quanto realmente era reclamacao."}, "en": {"term": "Precision", "definition": "The proportion of predictions for a class that are correct.", "til_context": "In Lesson 6, precision matters when false positives are costly.", "example": "Of everything predicted as complaint, how much was actually complaint."}, "related": ["recall", "f1-score", "confusion-matrix"]}, {"id": "recall", "category": "machine-learning", "lesson_first_seen": "06", "pt-BR": {"term": "Recall", "english_term": "Recall", "definition": "Proporção de exemplos reais de uma classe que o modelo conseguiu identificar.", "til_context": "Na Aula 6, recall é discutido quando perder exemplos positivos é especialmente custoso.", "example": "Entre todas as reclamações reais, quantas foram detectadas."}, "en": {"term": "Recall", "definition": "The proportion of actual examples of a class that the model successfully identifies.", "til_context": "In Lesson 6, recall matters when missing positive examples is especially costly.", "example": "Of all real complaints, how many were detected."}, "related": ["precision", "f1-score", "confusion-matrix"]}, {"id": "f1-score", "category": "machine-learning", "lesson_first_seen": "06", "pt-BR": {"term": "F1-score", "english_term": "F1-score", "definition": "Média harmônica entre precisão e recall.", "til_context": "Na Aula 6, F1-score é apresentado como uma forma de equilibrar as duas métricas.", "example": "Útil quando precisão e recall precisam ser considerados em conjunto."}, "en": {"term": "F1-score", "definition": "The harmonic mean of precision and recall.", "til_context": "In Lesson 6, F1-score is introduced as a way to balance both metrics.", "example": "Useful when precision and recall must be considered together."}, "related": ["precision", "recall", "confusion-matrix"]}, {"id": "macro-average", "category": "machine-learning", "lesson_first_seen": "06", "pt-BR": {"term": "Macro average", "english_term": "Macro average", "definition": "Média simples de uma métrica calculada separadamente para cada classe.", "til_context": "Na Aula 6, macro average ajuda a dar o mesmo peso a todas as classes.", "example": "Média dos F1-scores das classes sem ponderação por tamanho."}, "en": {"term": "Macro average", "definition": "The unweighted mean of a metric computed separately for each class.", "til_context": "In Lesson 6, macro average gives equal weight to each class.", "example": "Mean of class F1-scores without weighting by class size."}, "related": ["weighted-average", "f1-score"]}, {"id": "weighted-average", "category": "machine-learning", "lesson_first_seen": "06", "pt-BR": {"term": "Weighted average", "english_term": "Weighted average", "definition": "Média de uma métrica ponderada pelo número de exemplos de cada classe.", "til_context": "Na Aula 6, weighted average é comparada à macro average em cenários com classes de tamanhos diferentes.", "example": "Classes maiores contribuem mais para a média."}, "en": {"term": "Weighted average", "definition": "A metric average weighted by the number of examples in each class.", "til_context": "In Lesson 6, weighted average is compared with macro average for differently sized classes.", "example": "Larger classes contribute more to the average."}, "related": ["macro-average", "f1-score"]}, {"id": "cross-validation", "category": "machine-learning", "lesson_first_seen": "07", "pt-BR": {"term": "Validação cruzada", "english_term": "Cross-validation", "definition": "Estratégia de avaliação que divide os dados de treinamento em múltiplas partes e alterna quais partes são usadas para treino e validação.", "til_context": "Na Aula 7, validação cruzada permite comparar configurações sem usar o conjunto de teste final.", "example": "Validação cruzada com 3 folds."}, "en": {"term": "Cross-validation", "definition": "An evaluation strategy that splits training data into multiple parts and rotates which parts are used for training and validation.", "til_context": "In Lesson 7, cross-validation allows configuration comparison without using the final test set.", "example": "3-fold cross-validation."}, "related": ["grid-search", "hyperparameter", "train-test-split"]}, {"id": "hyperparameter", "category": "machine-learning", "lesson_first_seen": "07", "pt-BR": {"term": "Hiperparâmetro", "english_term": "Hyperparameter", "definition": "Configuração definida antes do treinamento que controla o comportamento de um algoritmo ou pipeline.", "til_context": "Na Aula 7, ngram_range, min_df e alpha são hiperparâmetros ajustados.", "example": "classifier__alpha igual a 0.5 ou 1.0."}, "en": {"term": "Hyperparameter", "definition": "A configuration set before training that controls the behavior of an algorithm or pipeline.", "til_context": "In Lesson 7, ngram_range, min_df, and alpha are tuned hyperparameters.", "example": "classifier__alpha equal to 0.5 or 1.0."}, "related": ["grid-search", "cross-validation"]}, {"id": "grid-search", "category": "machine-learning", "lesson_first_seen": "07", "pt-BR": {"term": "Grid Search", "english_term": "Grid Search", "definition": "Estratégia de busca que avalia sistematicamente combinações predefinidas de hiperparâmetros.", "til_context": "Na Aula 7, GridSearchCV combina Grid Search e validação cruzada para selecionar configurações.", "example": "Testar diferentes valores de ngram_range, min_df e alpha."}, "en": {"term": "Grid Search", "definition": "A search strategy that systematically evaluates predefined combinations of hyperparameters.", "til_context": "In Lesson 7, GridSearchCV combines Grid Search and cross-validation to select configurations.", "example": "Testing different ngram_range, min_df, and alpha values."}, "related": ["cross-validation", "hyperparameter"]}, {"id": "overfitting", "category": "machine-learning", "lesson_first_seen": "07", "pt-BR": {"term": "Overfitting", "english_term": "Overfitting", "definition": "Situação em que um modelo ou processo de seleção se ajusta excessivamente aos dados observados e perde capacidade de generalização.", "til_context": "Na Aula 7, olhar repetidamente o conjunto de teste durante o tuning é apresentado como risco de overfitting ao teste.", "example": "Escolher repetidamente configurações pela melhor nota no teste final."}, "en": {"term": "Overfitting", "definition": "A situation in which a model or selection process fits observed data too closely and loses generalization ability.", "til_context": "In Lesson 7, repeatedly consulting the test set during tuning is presented as a risk of test-set overfitting.", "example": "Repeatedly choosing configurations based on the final test score."}, "related": ["cross-validation", "train-test-split"]}, {"id": "token", "category": "text-intelligence", "lesson_first_seen": "02", "pt-BR": {"term": "Token", "english_term": "Token", "definition": "Unidade resultante da segmentação de um texto para processamento computacional.", "til_context": "Na Aula 2, começamos tratando palavras como tokens, embora outras técnicas possam usar subpalavras ou caracteres.", "example": "Na frase \"atendimento excelente\", atendimento e excelente podem ser tokens."}, "en": {"term": "Token", "definition": "A unit produced by segmenting text for computational processing.", "til_context": "In Lesson 2, we begin by treating words as tokens, although other techniques may use subwords or characters.", "example": "In \"excellent service\", excellent and service may be tokens."}, "related": ["tokenization", "raw-text"]}, {"id": "tokenization", "category": "text-intelligence", "lesson_first_seen": "02", "pt-BR": {"term": "Tokenização", "english_term": "Tokenization", "definition": "Processo de dividir texto em unidades menores chamadas tokens.", "til_context": "Na Aula 2, comparamos uma estratégia simples com split e uma tokenização baseada em expressão regular.", "example": "'\"atendimento excelente\" se torna [\"atendimento\", \"excelente\"].'"}, "en": {"term": "Tokenization", "definition": "The process of splitting text into smaller units called tokens.", "til_context": "In Lesson 2, we compare a simple split strategy with regular-expression tokenization.", "example": "'\"excellent service\" becomes [\"excellent\", \"service\"].'"}, "related": ["token", "normalization", "raw-text"]}, {"id": "normalization", "category": "text-intelligence", "lesson_first_seen": "02", "pt-BR": {"term": "Normalização textual", "english_term": "Text normalization", "definition": "Conjunto de transformações aplicadas para reduzir variações superficiais do texto preservando a informação relevante ao problema.", "til_context": "Na Aula 2, usamos minúsculas e remoção de espaços nas extremidades como exemplos simples.", "example": "'\" ATENDIMENTO \" se torna \"atendimento\".'"}, "en": {"term": "Text normalization", "definition": "A set of transformations used to reduce superficial text variation while preserving information relevant to the problem.", "til_context": "In Lesson 2, lowercasing and trimming whitespace are used as simple examples.", "example": "'\" SERVICE \" becomes \"service\".'"}, "related": ["tokenization", "raw-text"]}, {"id": "regular-expression", "category": "engineering", "lesson_first_seen": "02", "pt-BR": {"term": "Expressão regular", "english_term": "Regular expression", "definition": "Linguagem compacta de padrões usada para localizar, validar ou extrair sequências de caracteres.", "til_context": "Na Aula 2, a biblioteca padrão re é usada para extrair tokens com um padrão simples.", "example": "re.findall(r\"\\\\b\\\\w+\\\\b\", text)."}, "en": {"term": "Regular expression", "definition": "A compact pattern language used to locate, validate, or extract character sequences.", "til_context": "In Lesson 2, Python's standard re library is used to extract tokens with a simple pattern.", "example": "re.findall(r\"\\\\b\\\\w+\\\\b\", text)."}, "related": ["tokenization"]}, {"id": "n-gram", "category": "text-intelligence", "lesson_first_seen": "08", "pt-BR": {"term": "N-gram", "english_term": "N-gram", "definition": "Sequência de n tokens consecutivos usada como unidade de representação textual.", "til_context": "Na Aula 8, n-grams preservam parte do contexto local que se perde quando usamos apenas palavras isoladas.", "example": "Em \"não gostei\", \"não gostei\" é um bigrama."}, "en": {"term": "N-gram", "definition": "A sequence of n consecutive tokens used as a unit of text representation.", "til_context": "In Lesson 8, n-grams preserve some local context that is lost when using only isolated words.", "example": "In \"did not like\", \"not like\" can be a bigram."}, "related": ["unigram", "bigram", "trigram", "token"]}, {"id": "unigram", "category": "text-intelligence", "lesson_first_seen": "08", "pt-BR": {"term": "Unigrama", "english_term": "Unigram", "definition": "N-gram formado por um único token.", "til_context": "Na Aula 8, unigramas representam o caso tradicional de palavras isoladas.", "example": "\"atendimento\" é um unigrama."}, "en": {"term": "Unigram", "definition": "An n-gram consisting of a single token.", "til_context": "In Lesson 8, unigrams represent the traditional isolated-word case.", "example": "\"service\" is a unigram."}, "related": ["n-gram", "bigram"]}, {"id": "bigram", "category": "text-intelligence", "lesson_first_seen": "08", "pt-BR": {"term": "Bigrama", "english_term": "Bigram", "definition": "N-gram formado por dois tokens consecutivos.", "til_context": "Na Aula 8, bigramas mostram como combinações como \"não gostei\" podem se tornar features explícitas.", "example": "\"não gostei\" é um bigrama."}, "en": {"term": "Bigram", "definition": "An n-gram consisting of two consecutive tokens.", "til_context": "In Lesson 8, bigrams show how combinations such as \"not like\" can become explicit features.", "example": "\"not like\" is a bigram."}, "related": ["n-gram", "unigram", "trigram"]}, {"id": "trigram", "category": "text-intelligence", "lesson_first_seen": "08", "pt-BR": {"term": "Trigrama", "english_term": "Trigram", "definition": "N-gram formado por três tokens consecutivos.", "til_context": "Na Aula 8, trigramas ilustram o ganho de contexto e o aumento da dimensionalidade.", "example": "\"não gostei do\" é um trigrama."}, "en": {"term": "Trigram", "definition": "An n-gram consisting of three consecutive tokens.", "til_context": "In Lesson 8, trigrams illustrate the gain in context and the increase in dimensionality.", "example": "\"did not like\" is a trigram."}, "related": ["n-gram", "bigram"]}, {"id": "dimensionality", "category": "machine-learning", "lesson_first_seen": "08", "pt-BR": {"term": "Dimensionalidade", "english_term": "Dimensionality", "definition": "Número de dimensões ou features usadas para representar os dados.", "til_context": "Na Aula 8, adicionar bigramas e trigramas aumenta o número de colunas da matriz textual.", "example": "Um vocabulário com 5000 features produz uma representação de dimensionalidade 5000."}, "en": {"term": "Dimensionality", "definition": "The number of dimensions or features used to represent data.", "til_context": "In Lesson 8, adding bigrams and trigrams increases the number of columns in the text matrix.", "example": "A vocabulary with 5000 features produces a 5000-dimensional representation."}, "related": ["feature", "sparse-matrix", "n-gram"]}, {"id": "embedding", "category": "text-intelligence", "lesson_first_seen": "09", "pt-BR": {"term": "Embedding", "english_term": "Embedding", "definition": "Representação vetorial aprendida que mapeia entidades, como palavras, para um espaço numérico contínuo.", "til_context": "Na Aula 9, palavras deixam de ocupar uma dimensão exclusiva e passam a ser representadas por vetores densos.", "example": "atendimento pode ser representado por [0.18, -0.42, 0.77, ...]."}, "en": {"term": "Embedding", "definition": "A learned vector representation that maps entities such as words into a continuous numerical space.", "til_context": "In Lesson 9, words stop occupying exclusive dimensions and are represented by dense vectors.", "example": "service may be represented by [0.18, -0.42, 0.77, ...]."}, "related": ["dense-vector", "distributed-representation", "cosine-similarity"]}, {"id": "dense-vector", "category": "machine-learning", "lesson_first_seen": "09", "pt-BR": {"term": "Vetor denso", "english_term": "Dense vector", "definition": "Vetor em que a maior parte das posições contém valores informativos, em contraste com representações esparsas dominadas por zeros.", "til_context": "Na Aula 9, embeddings de palavras são vetores densos de baixa dimensionalidade relativa.", "example": "\"[0.18, -0.42, 0.77, 0.11].\""}, "en": {"term": "Dense vector", "definition": "A vector in which most positions contain informative values, unlike sparse representations dominated by zeros.", "til_context": "In Lesson 9, word embeddings are relatively low-dimensional dense vectors.", "example": "\"[0.18, -0.42, 0.77, 0.11].\""}, "related": ["embedding", "sparse-matrix", "dimensionality"]}, {"id": "distributed-representation", "category": "text-intelligence", "lesson_first_seen": "09", "pt-BR": {"term": "Representação distribuída", "english_term": "Distributed representation", "definition": "Representação em que a informação não está concentrada em uma única dimensão, mas distribuída por várias dimensões do vetor.", "til_context": "Na Aula 9, o significado lexical é aproximado por padrões distribuídos aprendidos a partir do contexto.", "example": "Duas palavras semelhantes podem compartilhar padrões próximos em várias dimensões."}, "en": {"term": "Distributed representation", "definition": "A representation in which information is not concentrated in a single dimension but distributed across multiple vector dimensions.", "til_context": "In Lesson 9, lexical meaning is approximated by distributed patterns learned from context.", "example": "Similar words may share nearby patterns across many dimensions."}, "related": ["embedding", "dense-vector"]}, {"id": "cosine-similarity", "category": "machine-learning", "lesson_first_seen": "09", "pt-BR": {"term": "Similaridade por cosseno", "english_term": "Cosine similarity", "definition": "Medida de similaridade baseada no ângulo entre dois vetores.", "til_context": "Na Aula 9, é usada para comparar embeddings de palavras.", "example": "Vetores com direções muito parecidas têm similaridade próxima de 1."}, "en": {"term": "Cosine similarity", "definition": "A similarity measure based on the angle between two vectors.", "til_context": "In Lesson 9, it is used to compare word embeddings.", "example": "Vectors pointing in very similar directions have similarity close to 1."}, "related": ["embedding", "dense-vector"]}, {"id": "word2vec", "category": "text-intelligence", "lesson_first_seen": "09", "pt-BR": {"term": "Word2Vec", "english_term": "Word2Vec", "definition": "Família de métodos neurais que aprende embeddings de palavras a partir de seus contextos de ocorrência.", "til_context": "Na Aula 9, treinamos um pequeno Word2Vec com gensim apenas para observar o mecanismo.", "example": "Skip-gram tenta prever palavras de contexto a partir de uma palavra central."}, "en": {"term": "Word2Vec", "definition": "A family of neural methods that learns word embeddings from occurrence contexts.", "til_context": "In Lesson 9, a small Word2Vec model is trained with gensim for observation.", "example": "Skip-gram predicts context words from a central word."}, "related": ["embedding", "fasttext", "distributed-representation"]}, {"id": "fasttext", "category": "text-intelligence", "lesson_first_seen": "09", "pt-BR": {"term": "FastText", "english_term": "FastText", "definition": "Método de embeddings que representa palavras também por unidades de subpalavras.", "til_context": "Na Aula 9, FastText é apresentado como evolução útil para variações morfológicas e palavras raras.", "example": "Uma palavra pode ser composta por vários fragmentos de caracteres."}, "en": {"term": "FastText", "definition": "An embedding method that also represents words through subword units.", "til_context": "In Lesson 9, FastText is introduced as useful for morphological variation and rare words.", "example": "A word may be composed from several character fragments."}, "related": ["word2vec", "embedding"]}, {"id": "static-embedding", "category": "text-intelligence", "lesson_first_seen": "09", "pt-BR": {"term": "Embedding estático", "english_term": "Static embedding", "definition": "Embedding que atribui essencialmente a mesma representação a uma palavra independentemente do contexto em que ocorre.", "til_context": "Na Aula 9, essa limitação prepara a transição futura para embeddings contextuais.", "example": "banco recebe a mesma representação em \"banco aprovou\" e \"banco da praça\"."}, "en": {"term": "Static embedding", "definition": "An embedding that essentially assigns the same representation to a word regardless of its context.", "til_context": "In Lesson 9, this limitation prepares the later transition to contextual embeddings.", "example": "bank receives the same representation in different senses."}, "related": ["embedding", "word2vec"]}, {"id": "contextual-embedding", "category": "text-intelligence", "lesson_first_seen": "10", "pt-BR": {"term": "Embedding contextual", "english_term": "Contextual embedding", "definition": "Representação vetorial cujo valor depende do contexto em que o token aparece.", "til_context": "Na Aula 10, a mesma palavra recebe vetores diferentes em frases com sentidos distintos.", "example": "bank em contexto financeiro e bank em contexto geográfico."}, "en": {"term": "Contextual embedding", "definition": "A vector representation whose value depends on the context in which a token appears.", "til_context": "In Lesson 10, the same word receives different vectors in sentences with different meanings.", "example": "bank in a financial context and bank in a river context."}, "related": ["static-embedding", "transformer", "self-attention"]}, {"id": "attention", "category": "text-intelligence", "lesson_first_seen": "10", "pt-BR": {"term": "Atenção", "english_term": "Attention", "definition": "Mecanismo que calcula pesos de relevância entre elementos de uma sequência para combinar informação contextual.", "til_context": "Na Aula 10, atenção é introduzida como base para contextualizar tokens em Transformers.", "example": "Um token pode atribuir maior peso a palavras relevantes ao seu redor."}, "en": {"term": "Attention", "definition": "A mechanism that computes relevance weights between sequence elements to combine contextual information.", "til_context": "In Lesson 10, attention is introduced as a basis for contextualizing tokens in Transformers.", "example": "A token may assign greater weight to relevant surrounding words."}, "related": ["self-attention", "transformer", "contextual-embedding"]}, {"id": "self-attention", "category": "text-intelligence", "lesson_first_seen": "10", "pt-BR": {"term": "Self-attention", "english_term": "Self-attention", "definition": "Forma de atenção em que elementos da mesma sequência interagem entre si.", "til_context": "Na Aula 10, self-attention permite que cada token considere os demais tokens da frase.", "example": "bank considera river em uma frase para construir sua representação contextual."}, "en": {"term": "Self-attention", "definition": "A form of attention in which elements of the same sequence interact with one another.", "til_context": "In Lesson 10, self-attention lets each token consider other tokens in the sentence.", "example": "bank considers river in a sentence when building its contextual representation."}, "related": ["attention", "transformer", "contextual-embedding"]}, {"id": "transformer", "category": "text-intelligence", "lesson_first_seen": "10", "pt-BR": {"term": "Transformer", "english_term": "Transformer", "definition": "Arquitetura neural baseada em mecanismos de atenção para processar sequências e construir representações contextualizadas.", "til_context": "Na Aula 10, Transformers são apresentados como base de grande parte dos modelos modernos de linguagem.", "example": "BERT e muitos modelos autoregressivos usam arquitetura Transformer."}, "en": {"term": "Transformer", "definition": "A neural architecture based on attention mechanisms for processing sequences and building contextual representations.", "til_context": "In Lesson 10, Transformers are introduced as the foundation of many modern language models.", "example": "BERT and many autoregressive models use Transformer architecture."}, "related": ["attention", "self-attention", "contextual-embedding"]}, {"id": "subword-tokenization", "category": "text-intelligence", "lesson_first_seen": "10", "pt-BR": {"term": "Tokenização por subpalavras", "english_term": "Subword tokenization", "definition": "Estratégia que divide palavras em unidades menores reutilizáveis para reduzir problemas de vocabulário e palavras raras.", "til_context": "Na Aula 10, subwords são apresentados como unidades comuns em tokenizadores de Transformers.", "example": "Uma palavra rara pode ser dividida em fragmentos conhecidos pelo vocabulário."}, "en": {"term": "Subword tokenization", "definition": "A strategy that splits words into smaller reusable units to reduce vocabulary and rare-word problems.", "til_context": "In Lesson 10, subwords are introduced as common units in Transformer tokenizers.", "example": "A rare word may be split into fragments known by the vocabulary."}, "related": ["tokenization", "transformer"]}, {"id": "pretrained-model", "category": "machine-learning", "lesson_first_seen": "10", "pt-BR": {"term": "Modelo pré-treinado", "english_term": "Pretrained model", "definition": "Modelo que já passou por treinamento em uma grande coleção de dados antes de ser reutilizado em outra tarefa.", "til_context": "Na Aula 10, um encoder pré-treinado é usado apenas para inferência e observação de embeddings contextuais.", "example": "distilbert-base-uncased carregado para extrair representações."}, "en": {"term": "Pretrained model", "definition": "A model that has already been trained on a large dataset before being reused for another task.", "til_context": "In Lesson 10, a pretrained encoder is used only for inference and contextual embedding observation.", "example": "distilbert-base-uncased loaded to extract representations."}, "related": ["transformer", "contextual-embedding"]}, {"id": "fine-tuning", "category": "machine-learning", "lesson_first_seen": "11", "pt-BR": {"term": "Fine-tuning", "english_term": "Fine-tuning", "definition": "Processo de adaptar um modelo pré-treinado a uma tarefa específica usando dados rotulados da nova tarefa.", "til_context": "Na Aula 11, um Transformer multilíngue é ajustado para classificar mensagens em três categorias.", "example": "Ajustar um encoder pré-treinado para prever duvida, reclamacao ou elogio."}, "en": {"term": "Fine-tuning", "definition": "The process of adapting a pretrained model to a specific task using labeled data from the new task.", "til_context": "In Lesson 11, a multilingual Transformer is fine-tuned to classify messages into three categories.", "example": "Adapting a pretrained encoder to predict question, complaint, or praise."}, "related": ["pretrained-model", "transfer-learning", "sequence-classification"]}, {"id": "transfer-learning", "category": "machine-learning", "lesson_first_seen": "11", "pt-BR": {"term": "Transfer learning", "english_term": "Transfer learning", "definition": "Estratégia de reutilizar conhecimento aprendido em uma tarefa ou domínio para acelerar ou melhorar o aprendizado em outra tarefa.", "til_context": "Na Aula 11, o conhecimento linguístico do modelo pré-treinado é transferido para classificação de mensagens.", "example": "Reutilizar BERT em vez de treinar um modelo de linguagem do zero."}, "en": {"term": "Transfer learning", "definition": "A strategy that reuses knowledge learned in one task or domain to accelerate or improve learning in another task.", "til_context": "In Lesson 11, pretrained linguistic knowledge is transferred to message classification.", "example": "Reusing BERT instead of training a language model from scratch."}, "related": ["fine-tuning", "pretrained-model"]}, {"id": "sequence-classification", "category": "text-intelligence", "lesson_first_seen": "11", "pt-BR": {"term": "Classificação de sequência", "english_term": "Sequence classification", "definition": "Tarefa em que uma sequência textual inteira recebe uma classe ou rótulo.", "til_context": "Na Aula 11, cada mensagem recebe uma das classes duvida, reclamacao ou elogio.", "example": "Classificar uma mensagem de atendimento em uma categoria."}, "en": {"term": "Sequence classification", "definition": "A task in which an entire text sequence receives a class or label.", "til_context": "In Lesson 11, each message receives one of the labels question, complaint, or praise.", "example": "Classifying a customer-service message into a category."}, "related": ["classification", "fine-tuning"]}, {"id": "epoch", "category": "machine-learning", "lesson_first_seen": "11", "pt-BR": {"term": "Época", "english_term": "Epoch", "definition": "Uma passagem completa do algoritmo de treinamento por todos os exemplos do conjunto de treino.", "til_context": "Na Aula 11, usamos uma única época para manter o experimento leve e didático.", "example": "num_train_epochs=1."}, "en": {"term": "Epoch", "definition": "One complete pass of the training algorithm through all examples in the training set.", "til_context": "In Lesson 11, a single epoch is used to keep the experiment lightweight and didactic.", "example": "num_train_epochs=1."}, "related": ["batch", "learning-rate", "fine-tuning"]}, {"id": "batch", "category": "machine-learning", "lesson_first_seen": "11", "pt-BR": {"term": "Batch", "english_term": "Batch", "definition": "Pequeno grupo de exemplos processados juntos durante uma etapa de treinamento.", "til_context": "Na Aula 11, o batch size controla quantas mensagens entram em cada passo.", "example": "per_device_train_batch_size=4."}, "en": {"term": "Batch", "definition": "A small group of examples processed together during a training step.", "til_context": "In Lesson 11, batch size controls how many messages are processed in each step.", "example": "per_device_train_batch_size=4."}, "related": ["epoch", "learning-rate"]}, {"id": "learning-rate", "category": "machine-learning", "lesson_first_seen": "11", "pt-BR": {"term": "Learning rate", "english_term": "Learning rate", "definition": "Hiperparâmetro que controla o tamanho das atualizações aplicadas aos pesos durante o treinamento.", "til_context": "Na Aula 11, usamos uma taxa pequena adequada ao fine-tuning de um modelo pré-treinado.", "example": "learning_rate=2e-5."}, "en": {"term": "Learning rate", "definition": "A hyperparameter that controls the size of weight updates during training.", "til_context": "In Lesson 11, a small rate is used for fine-tuning a pretrained model.", "example": "learning_rate=2e-5."}, "related": ["epoch", "batch", "hyperparameter"]}, {"id": "tokenizer", "category": "text-intelligence", "lesson_first_seen": "11", "pt-BR": {"term": "Tokenizer", "english_term": "Tokenizer", "definition": "Componente que converte texto em unidades e identificadores numéricos compatíveis com o vocabulário de um modelo.", "til_context": "Na Aula 11, o tokenizer prepara as mensagens para entrada no Transformer.", "example": "AutoTokenizer.from_pretrained(...)."}, "en": {"term": "Tokenizer", "definition": "A component that converts text into units and numerical identifiers compatible with a model vocabulary.", "til_context": "In Lesson 11, the tokenizer prepares messages for Transformer input.", "example": "AutoTokenizer.from_pretrained(...)."}, "related": ["tokenization", "subword-tokenization", "transformer"]}, {"id": "baseline", "category": "machine-learning", "lesson_first_seen": "12", "pt-BR": {"term": "Baseline", "english_term": "Baseline", "definition": "Modelo ou resultado de referência usado para comparar abordagens mais complexas.", "til_context": "Na Aula 12, modelos clássicos servem de referência para decidir se a complexidade de um Transformer se justifica.", "example": "TF-IDF + LinearSVC pode funcionar como baseline forte para classificação de texto."}, "en": {"term": "Baseline", "definition": "A reference model or result used to compare more complex approaches.", "til_context": "In Lesson 12, classical models provide a reference for deciding whether Transformer complexity is justified.", "example": "TF-IDF + LinearSVC can serve as a strong baseline for text classification."}, "related": ["classification", "f1-score"]}, {"id": "logistic-regression", "category": "machine-learning", "lesson_first_seen": "12", "pt-BR": {"term": "Regressão Logística", "english_term": "Logistic Regression", "definition": "Modelo linear discriminativo usado para classificação ao estimar escores associados às classes.", "til_context": "Na Aula 12, é comparada com Naive Bayes e LinearSVC usando a mesma representação TF-IDF.", "example": "LogisticRegression(max_iter=1000)."}, "en": {"term": "Logistic Regression", "definition": "A discriminative linear model used for classification by estimating class-associated scores.", "til_context": "In Lesson 12, it is compared with Naive Bayes and LinearSVC using the same TF-IDF representation.", "example": "LogisticRegression(max_iter=1000)."}, "related": ["baseline", "linear-svc"]}, {"id": "linear-svc", "category": "machine-learning", "lesson_first_seen": "12", "pt-BR": {"term": "LinearSVC", "english_term": "LinearSVC", "definition": "Classificador SVM linear que busca uma fronteira de decisão com ampla margem entre classes.", "til_context": "Na Aula 12, é usado como baseline forte para espaços textuais de alta dimensionalidade.", "example": "LinearSVC(random_state=42)."}, "en": {"term": "LinearSVC", "definition": "A linear SVM classifier that seeks a decision boundary with a wide margin between classes.", "til_context": "In Lesson 12, it is used as a strong baseline for high-dimensional text spaces.", "example": "LinearSVC(random_state=42)."}, "related": ["baseline", "margin", "logistic-regression"]}, {"id": "margin", "category": "machine-learning", "lesson_first_seen": "12", "pt-BR": {"term": "Margem", "english_term": "Margin", "definition": "Distância entre a fronteira de decisão e os exemplos mais próximos em modelos baseados em margem.", "til_context": "Na Aula 12, ajuda a explicar a lógica do LinearSVC.", "example": "SVMs procuram separar classes com uma margem ampla."}, "en": {"term": "Margin", "definition": "The distance between a decision boundary and the nearest examples in margin-based models.", "til_context": "In Lesson 12, it helps explain how LinearSVC works.", "example": "SVMs seek to separate classes with a wide margin."}, "related": ["linear-svc"]}, {"id": "coefficient", "category": "machine-learning", "lesson_first_seen": "12", "pt-BR": {"term": "Coeficiente", "english_term": "Coefficient", "definition": "Peso aprendido por um modelo linear para indicar a contribuição de uma feature à decisão.", "til_context": "Na Aula 12, coeficientes do LinearSVC são inspecionados para identificar features fortemente associadas às classes.", "example": "Um coeficiente positivo alto pode favorecer uma classe específica."}, "en": {"term": "Coefficient", "definition": "A weight learned by a linear model indicating a feature's contribution to the decision.", "til_context": "In Lesson 12, LinearSVC coefficients are inspected to identify features strongly associated with classes.", "example": "A large positive coefficient may favor a specific class."}, "related": ["feature", "linear-svc"]}, {"id": "false-positive", "category": "evaluation", "lesson_first_seen": "13", "pt-BR": {"term": "Falso positivo", "english_term": "False Positive", "definition": "Caso negativo real que o modelo classificou incorretamente como positivo.", "til_context": "Na Aula 13, falsos positivos são associados ao custo de alertas incorretos e revisões desnecessárias.", "example": "Uma transação legítima marcada como fraude."}, "en": {"term": "False Positive", "definition": "A truly negative case incorrectly classified as positive.", "til_context": "In Lesson 13, false positives are linked to the cost of incorrect alerts and unnecessary reviews.", "example": "A legitimate transaction flagged as fraud."}, "related": ["precision", "confusion-matrix"]}, {"id": "false-negative", "category": "evaluation", "lesson_first_seen": "13", "pt-BR": {"term": "Falso negativo", "english_term": "False Negative", "definition": "Caso positivo real que o modelo classificou incorretamente como negativo.", "til_context": "Na Aula 13, falsos negativos representam casos importantes que o sistema deixou escapar.", "example": "Uma fraude real classificada como transação legítima."}, "en": {"term": "False Negative", "definition": "A truly positive case incorrectly classified as negative.", "til_context": "In Lesson 13, false negatives represent important cases the system failed to detect.", "example": "A fraudulent transaction classified as legitimate."}, "related": ["recall", "confusion-matrix"]}, {"id": "specificity", "category": "evaluation", "lesson_first_seen": "13", "pt-BR": {"term": "Especificidade", "english_term": "Specificity", "definition": "Proporção dos negativos reais corretamente identificados como negativos.", "til_context": "Na Aula 13, complementa o recall ao observar o comportamento sobre a classe negativa.", "example": "TN / (TN + FP)."}, "en": {"term": "Specificity", "definition": "The proportion of truly negative cases correctly identified as negative.", "til_context": "In Lesson 13, it complements recall by describing behavior on the negative class.", "example": "TN / (TN + FP)."}, "related": ["recall", "balanced-accuracy"]}, {"id": "balanced-accuracy", "category": "evaluation", "lesson_first_seen": "13", "pt-BR": {"term": "Balanced Accuracy", "english_term": "Balanced Accuracy", "definition": "Métrica que dá peso equilibrado ao desempenho entre classes, reduzindo o efeito de desbalanceamento.", "til_context": "Na Aula 13, é apresentada como alternativa à acurácia simples em cenários desbalanceados.", "example": "No caso binário, pode ser vista como a média entre recall e especificidade."}, "en": {"term": "Balanced Accuracy", "definition": "A metric that balances performance across classes, reducing the effect of class imbalance.", "til_context": "In Lesson 13, it is introduced as an alternative to plain accuracy in imbalanced settings.", "example": "In binary classification, it can be seen as the mean of recall and specificity."}, "related": ["accuracy", "specificity", "recall"]}, {"id": "support", "category": "evaluation", "lesson_first_seen": "13", "pt-BR": {"term": "Support", "english_term": "Support", "definition": "Quantidade de exemplos reais pertencentes a uma classe em um conjunto avaliado.", "til_context": "Na Aula 13, support ajuda a entender por que weighted averages podem ser dominadas por classes maiores.", "example": "Uma classe com 900 exemplos tem support muito maior que outra com 20."}, "en": {"term": "Support", "definition": "The number of true examples belonging to a class in an evaluated dataset.", "til_context": "In Lesson 13, support helps explain why weighted averages may be dominated by larger classes.", "example": "A class with 900 examples has much more support than a class with 20."}, "related": ["weighted-average", "macro-average"]}, {"id": "decision-threshold", "category": "evaluation", "lesson_first_seen": "13", "pt-BR": {"term": "Threshold de decisão", "english_term": "Decision Threshold", "definition": "Valor de corte usado para transformar um score ou probabilidade em uma decisão de classe.", "til_context": "Na Aula 13, alterar o threshold mostra o trade-off entre precision e recall.", "example": "score >= 0.50 implica classe positiva."}, "en": {"term": "Decision Threshold", "definition": "A cutoff used to convert a score or probability into a class decision.", "til_context": "In Lesson 13, changing the threshold demonstrates the trade-off between precision and recall.", "example": "score >= 0.50 implies the positive class."}, "related": ["precision", "recall"]}, {"id": "abstention-rate", "category": "production", "lesson_first_seen": "13", "pt-BR": {"term": "Taxa de abstenção", "english_term": "Abstention Rate", "definition": "Proporção de casos em que o sistema evita emitir uma decisão automática e encaminha o caso para outro fluxo.", "til_context": "Na Aula 13, aparece como indicador operacional ao lado de qualidade e latência.", "example": "O modelo abstém em 8% dos casos e envia esses casos para revisão humana."}, "en": {"term": "Abstention Rate", "definition": "The proportion of cases where a system avoids making an automatic decision and routes the case elsewhere.", "til_context": "In Lesson 13, it appears as an operational indicator alongside quality and latency.", "example": "The model abstains on 8% of cases and sends them to human review."}, "related": ["decision-threshold", "latency"]}, {"id": "didactic-proxy", "category": "core", "lesson_first_seen": "13", "pt-BR": {"term": "Proxy didático", "english_term": "Didactic proxy", "definition": "Representação simplificada usada para aproximar um conceito, custo, comportamento ou consequência real com finalidade de aprendizagem, sem pretender reproduzir toda a complexidade do fenômeno original.", "til_context": "Na Aula 13 e no Metric Scenario Lab, valores monetários atribuídos a erros podem funcionar como proxies didáticos para tornar trade-offs visíveis e comparáveis. Eles não devem ser confundidos com uma valoração completa de consequências humanas, éticas, sociais ou regulatórias.", "example": "Atribuir R$ 500 a um falso negativo em uma simulação médica pode ajudar a comparar cenários, mas esse valor não representa o valor de uma vida nem esgota o impacto de um diagnóstico perdido."}, "en": {"term": "Didactic proxy", "definition": "A simplified representation used to approximate a real concept, cost, behavior, or consequence for learning purposes without claiming to reproduce the full complexity of the original phenomenon.", "til_context": "In Lesson 13 and the Metric Scenario Lab, monetary values assigned to errors may act as didactic proxies to make trade-offs visible and comparable. They should not be confused with a complete valuation of human, ethical, social, or regulatory consequences.", "example": "Assigning R$ 500 to a false negative in a medical simulation can help compare scenarios, but that amount does not represent the value of a human life or exhaust the impact of a missed diagnosis."}, "related": ["trade-off", "false-negative", "false-positive", "decision-threshold"]}, {"id": "trade-off", "category": "core", "lesson_first_seen": "13", "pt-BR": {"term": "Trade-off", "english_term": "Trade-off", "definition": "Situação em que melhorar uma dimensão de uma decisão tende a piorar outra, exigindo equilíbrio entre objetivos que não podem ser maximizados simultaneamente.", "til_context": "Na Aula 13, reduzir o threshold pode aumentar o recall e diminuir falsos negativos, mas também aumentar falsos positivos e reduzir a precisão. O melhor ponto depende do contexto, dos custos e do objetivo do sistema.", "example": "Em triagem médica, aceitar mais falsos positivos pode ser um trade-off razoável se isso reduzir significativamente o risco de deixar pacientes graves sem encaminhamento."}, "en": {"term": "Trade-off", "definition": "A situation in which improving one dimension of a decision tends to worsen another, requiring a balance between objectives that cannot all be maximized simultaneously.", "til_context": "In Lesson 13, lowering a decision threshold may increase recall and reduce false negatives, but it may also increase false positives and reduce precision. The best point depends on context, costs, and system goals.", "example": "In medical triage, accepting more false positives may be a reasonable trade-off if it significantly reduces the risk of missing seriously ill patients."}, "related": ["didactic-proxy", "precision", "recall", "f1-score", "decision-threshold"]}, {"id": "harmonic-mean", "category": "machine-learning", "lesson_first_seen": "13", "pt-BR": {"term": "Média harmônica", "english_term": "Harmonic Mean", "definition": "Tipo de média que dá influência relativamente maior aos valores menores e, por isso, é útil quando um resultado só deve ser considerado forte se todos os componentes combinados também forem fortes.", "til_context": "No F1-score, a média harmônica combina Precisão e Recall e penaliza desequilíbrios: uma métrica muito alta não compensa facilmente a outra muito baixa.", "example": "Com Precisão de 0,90 e Recall de 0,30, a média aritmética é 0,60, enquanto o F1, baseado na média harmônica, é 0,45."}, "en": {"term": "Harmonic Mean", "definition": "A type of mean that gives relatively greater influence to smaller values and is therefore useful when a result should be considered strong only if all combined components are also strong.", "til_context": "In F1-score, the harmonic mean combines Precision and Recall and penalizes imbalance: one very high metric does not easily compensate for the other being very low.", "example": "With Precision 0.90 and Recall 0.30, the arithmetic mean is 0.60 while F1, based on the harmonic mean, is 0.45."}, "related": ["f1-score", "precision", "recall", "trade-off"]}, {"id": "model-routing", "category": "engineering", "lesson_first_seen": "13C", "pt-BR": {"term": "Roteamento de modelos", "english_term": "Model Routing", "definition": "Estratégia que decide qual modelo, ferramenta ou caminho de execução deve receber cada entrada com base em critérios como dificuldade, confiança, custo, latência ou risco.", "til_context": "Na Aula 13C, o roteador pode manter casos simples no modelo econômico e encaminhar casos de baixa confiança para uma camada mais forte.", "example": "Uma mensagem curta e inequívoca pode ser classificada pelo baseline, enquanto um caso ambíguo é encaminhado ao Transformer."}, "en": {"term": "Model Routing", "definition": "A strategy that decides which model, tool, or execution path should receive each input based on criteria such as difficulty, confidence, cost, latency, or risk.", "til_context": "In Lesson 13C, the router can keep simple cases on the economical model and send low-confidence cases to a stronger layer.", "example": "A short unambiguous message may be classified by the baseline while an ambiguous case is routed to the Transformer."}, "related": ["quality-gate", "model-orchestration", "escalation-rate", "trade-off"]}, {"id": "model-orchestration", "category": "engineering", "lesson_first_seen": "13C", "pt-BR": {"term": "Orquestração de modelos", "english_term": "Model Orchestration", "definition": "Coordenação de múltiplos modelos e etapas de processamento em um fluxo único, incluindo regras de roteamento, avaliação, revisão, fallback e escalonamento.", "til_context": "A Aula 13C compara estratégias single, cascade e critique para mostrar que o sistema pode ser mais importante do que um modelo isolado.", "example": "Um modelo econômico gera a primeira resposta, um gate avalia a qualidade e um modelo premium é acionado apenas quando necessário."}, "en": {"term": "Model Orchestration", "definition": "Coordination of multiple models and processing stages in one workflow, including routing rules, evaluation, review, fallback, and escalation.", "til_context": "Lesson 13C compares single, cascade, and critique strategies to show that the system can matter more than an isolated model.", "example": "An economical model produces the first answer, a gate evaluates quality, and a premium model is invoked only when needed."}, "related": ["model-routing", "quality-gate", "compound-ai-system", "escalation-rate"]}, {"id": "quality-gate", "category": "evaluation", "lesson_first_seen": "13C", "pt-BR": {"term": "Quality gate", "english_term": "Quality Gate", "definition": "Regra ou mecanismo de avaliação que decide se uma saída possui qualidade suficiente para ser aceita ou se precisa ser rejeitada, revisada ou escalada.", "til_context": "No simulador 13C, tornar o gate mais rigoroso aumenta a parcela de casos que segue para a camada premium e altera qualidade, custo e latência.", "example": "Se a confiança do classificador ficar abaixo de 0,70, o caso pode ser encaminhado para um modelo mais forte ou revisão humana."}, "en": {"term": "Quality Gate", "definition": "An evaluation rule or mechanism that decides whether an output has sufficient quality to be accepted or must be rejected, revised, or escalated.", "til_context": "In the 13C simulator, making the gate stricter increases the share of cases sent to the premium layer and changes quality, cost, and latency.", "example": "If classifier confidence falls below 0.70, the case may be sent to a stronger model or human review."}, "related": ["decision-threshold", "model-routing", "escalation-rate", "abstention"]}, {"id": "escalation-rate", "category": "evaluation", "lesson_first_seen": "13C", "pt-BR": {"term": "Taxa de escalonamento", "english_term": "Escalation Rate", "definition": "Proporção de casos que deixa a camada inicial e é encaminhada para uma etapa mais cara, mais lenta, mais especializada ou humana.", "til_context": "Na Aula 13C, a taxa de escalonamento é uma métrica operacional central para entender quanto o cascade realmente usa a camada premium.", "example": "Uma taxa de 25% significa que um em cada quatro casos segue além do modelo inicial."}, "en": {"term": "Escalation Rate", "definition": "The proportion of cases that leave the initial layer and are sent to a more expensive, slower, more specialized, or human stage.", "til_context": "In Lesson 13C, escalation rate is a key operational metric for understanding how much the cascade actually uses the premium layer.", "example": "A 25% escalation rate means one in four cases goes beyond the initial model."}, "related": ["quality-gate", "model-routing", "model-orchestration", "latency"]}, {"id": "utility-function", "category": "evaluation", "lesson_first_seen": "13C", "pt-BR": {"term": "Função de utilidade", "english_term": "Utility Function", "definition": "Função que combina diferentes objetivos em uma pontuação comum para tornar explícitas as prioridades usadas em uma decisão.", "til_context": "O simulador 13C usa uma função simples que recompensa qualidade e penaliza custo e latência, com pesos definidos pelo aluno.", "example": "U = wq·Q − wc·C − wl·L permite comparar sistemas quando qualidade, custo e latência têm importâncias diferentes."}, "en": {"term": "Utility Function", "definition": "A function that combines different objectives into a common score to make the priorities used in a decision explicit.", "til_context": "The 13C simulator uses a simple function that rewards quality and penalizes cost and latency, with weights chosen by the learner.", "example": "U = wq·Q − wc·C − wl·L can compare systems when quality, cost, and latency have different importance."}, "related": ["trade-off", "model-routing", "latency", "cost-per-inference"]}, {"id": "compound-ai-system", "category": "engineering", "lesson_first_seen": "13C", "pt-BR": {"term": "Sistema composto de IA", "english_term": "Compound AI System", "definition": "Sistema de IA formado por múltiplos componentes coordenados, como modelos, ferramentas, recuperadores, regras, verificadores e etapas humanas.", "til_context": "A Aula 13C amplia a avaliação do modelo isolado para a avaliação do sistema completo, incluindo roteamento, gates, custo, latência e revisão.", "example": "Um baseline classifica primeiro, um Transformer trata casos difíceis e um humano revisa situações críticas."}, "en": {"term": "Compound AI System", "definition": "An AI system composed of multiple coordinated components such as models, tools, retrievers, rules, verifiers, and human stages.", "til_context": "Lesson 13C expands evaluation from an isolated model to the whole system, including routing, gates, cost, latency, and review.", "example": "A baseline classifies first, a Transformer handles difficult cases, and a human reviews critical situations."}, "related": ["model-orchestration", "model-routing", "quality-gate", "human-in-the-loop"]}, {"id": "cost-per-inference", "category": "production", "lesson_first_seen": "13C", "pt-BR": {"term": "Custo por inferência", "english_term": "Cost per Inference", "definition": "Custo associado ao processamento de uma entrada pelo sistema, podendo incluir computação, tokens, chamadas de API, infraestrutura e etapas humanas.", "til_context": "No 13C, o custo pode ser informado em unidade monetária ou índice relativo, desde que a unidade seja consistente entre os sistemas comparados.", "example": "Se mil classificações custam R$ 12 em recursos computacionais, o custo médio por inferência é R$ 0,012."}, "en": {"term": "Cost per Inference", "definition": "The cost associated with processing one input through the system, potentially including compute, tokens, API calls, infrastructure, and human stages.", "til_context": "In 13C, cost may be provided as currency or a relative index as long as the unit is consistent across compared systems.", "example": "If one thousand classifications cost R$ 12 in compute resources, the average cost per inference is R$ 0.012."}, "related": ["utility-function", "latency", "model-routing", "trade-off"]}];
const categories = {"core": {"pt-BR": "Conceitos fundamentais", "en": "Core concepts"}, "text-intelligence": {"pt-BR": "Text Intelligence", "en": "Text Intelligence"}, "engineering": {"pt-BR": "Experimentação e engenharia", "en": "Experimentation and engineering"}, "machine-learning": {"pt-BR": "Machine Learning e estatística", "en": "Machine Learning and statistics"}, "evaluation": {"pt-BR": "Avaliação", "en": "Evaluation"}, "production": {"pt-BR": "Produção e operação", "en": "Production and operations"}};
let lang = "pt-BR";
const search = document.getElementById("search");
const category = document.getElementById("category");
const langButton = document.getElementById("lang");
const cards = document.getElementById("cards");
const count = document.getElementById("count");

Object.keys(categories).forEach(function(id){
  const option = document.createElement("option");
  option.value = id;
  option.textContent = categories[id]["pt-BR"];
  category.appendChild(option);
});

function displayName(t){ return lang === "pt-BR" ? t["pt-BR"].term : t.en.term; }

function render(){
  const q = search.value.trim().toLowerCase();
  const cat = category.value;
  const filtered = terms.filter(function(t){
    const x = t[lang];
    const alt = lang === "pt-BR" ? (x.english_term || t.en.term) : t["pt-BR"].term;
    const hay = [x.term, alt, x.definition, x.til_context, x.example].join(" ").toLowerCase();
    return (!q || hay.includes(q)) && (!cat || t.category === cat);
  });

  count.textContent = lang === "pt-BR" ? filtered.length + " conceito(s)" : filtered.length + " concept(s)";
  cards.innerHTML = "";

  filtered.forEach(function(t){
    const x = t[lang];
    const alt = lang === "pt-BR" ? (x.english_term || t.en.term) : t["pt-BR"].term;
    const article = document.createElement("article");
    article.className = "card";
    article.id = t.id;

    const related = (t.related || []).map(function(id){
      const target = terms.find(function(z){ return z.id === id; });
      return target ? '<a href="#' + id + '">' + displayName(target) + '</a>' : "";
    }).join("");

    article.innerHTML =
      '<div class="term">' + x.term + '</div>' +
      '<div class="alt">' + alt + '</div>' +
      '<span class="badge">' + categories[t.category][lang] + ' · ' + (lang === "pt-BR" ? "Aula " : "Lesson ") + t.lesson_first_seen + '</span>' +
      '<div class="label">' + (lang === "pt-BR" ? "Definição" : "Definition") + '</div>' +
      '<div class="text">' + x.definition + '</div>' +
      '<div class="label">' + (lang === "pt-BR" ? "No TIL" : "In TIL") + '</div>' +
      '<div class="text">' + x.til_context + '</div>' +
      '<div class="label">' + (lang === "pt-BR" ? "Exemplo" : "Example") + '</div>' +
      '<div class="text">' + x.example + '</div>' +
      '<div class="label">' + (lang === "pt-BR" ? "Relacionados" : "Related") + '</div>' +
      '<div class="related">' + related + '</div>';

    cards.appendChild(article);
  });
}

search.addEventListener("input", render);
category.addEventListener("change", render);
langButton.addEventListener("click", function(){
  lang = lang === "pt-BR" ? "en" : "pt-BR";
  langButton.textContent = lang === "pt-BR" ? "EN" : "PT-BR";
  search.placeholder = lang === "pt-BR" ? "Buscar conceito, definição ou exemplo..." : "Search concept, definition, or example...";
  category.options[0].textContent = lang === "pt-BR" ? "Todas as categorias" : "All categories";
  for(let i=1;i<category.options.length;i++){
    const id = category.options[i].value;
    category.options[i].textContent = categories[id][lang];
  }
  render();
});
render();
</script>
